services:
  finance-ledger:
    image: ghcr.io/shanemc92/finance-ledger:latest
    # To build locally instead of pulling, comment the image line above, uncomment
    # these, and run `docker compose up -d --build`. The context is the repo root
    # because the image serves the index.html that lives there:
    # build:
    #   context: ..
    #   dockerfile: homelab/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Required. The server refuses to start without it. Generate one with
      # `openssl rand -hex 32` and put it in a .env file next to this compose
      # file as AUTH_TOKEN=..., or set it in the shell before `docker compose up`.
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is not set - see homelab/README.md}
      # To run without a token on a network you already trust, comment the line
      # above out and uncomment this one instead:
      # ALLOW_NO_AUTH: "1"
      PORT: "8080"
      DATA_DIR: "/data"
