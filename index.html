/* View-only sort for the Budget tables. The underlying array keeps whatever manual
   order it has - this sorts a copy for display, so data-path indexes still point at
   the real records. */
const billSort = {bill:{col:null, dir:1}, savings:{col:null, dir:1}};
const BILL_COLS = {
  name:   b => String(b.name||'').toLowerCase(),
  freq:   b => FREQ[b.freq]||0,
  holder: b => String(b.holder||'').toLowerCase(),
  amount: b => num(b.amount),
  annual: b => annualOf(b),
  monthly:b => annualOf(b)/12,
  weekly: b => annualOf(b)/52,
  due:    b => b.nextDue || '9999'
};
function sortBills(kind, list){
  const st = billSort[kind];
  if(!st.col || !BILL_COLS[st.col]) return list;
  const key = BILL_COLS[st.col];
  return list.slice().sort((a,b)=>{
    const x = key(a), y = key(b);
    return (x<y ? -1 : x>y ? 1 : 0) * st.dir;
  });
}
function sortableTh(kind, col, label, cls){
  const st = billSort[kind];
  const on = st.col===col;
  const arrow = on ? (st.dir===1 ? ' \u2191' : ' \u2193') : '';
  return `<th class="${cls||''}" data-sort="${kind}.${col}" style="cursor:pointer;user-select:none"
    title="Sort by ${esc(label)}">${label}${arrow}</th>`;
}
function billTable(kind, title, rows, holders, actualByName, totals){
  const isSav = kind==='savings';
  rows = sortBills(kind, rows);
  const body = rows.map(b=>{
    const i = Y.bills.indexOf(b);
    const a = annualOf(b), act = actualByName[b.name];
    const due = nextDueFrom(b);
    const usage = act && act.monthlyBudget>0 ? act.monthlyActual/act.monthlyBudget*100 : null;
    return `<tr>
      <td><input data-path="bills.${i}.name" value="${esc(b.name)}"></td>
      <td><select data-path="bills.${i}.freq">${Object.keys(FREQ).map(f=>`<option ${f===b.freq?'selected':''}>${f}</option>`).join('')}</select></td>
      <td><select data-path="bills.${i}.holder">${holders.map(h=>`<option ${h===b.holder?'selected':''}>${esc(h)}</option>`).join('')}</select></td>
      <td class="n"><input class="num" style="text-align:right" data-path="bills.${i}.amount" data-type="number" value="${num(b.amount)}"></td>
      <td class="n">${fmt(a)}</td>
      <td class="n">${fmt(a/12)}</td>
      <td class="n">${fmt(a/52)}</td>
      <td><input type="date" data-path="bills.${i}.nextDue" value="${esc(b.nextDue||'')}" style="min-width:130px"></td>
      <td class="n">${due?iso(due):'<span class="mut">-</span>'}</td>
      <td class="n">${act?fmt(act.monthlyActual):'<span class="mut">-</span>'}</td>
      <td>${usage===null?'':barHtml(usage)}</td>
      <td class="act">
        <button class="btn sm" data-move="${esc(b.id)}" title="Move to ${isSav?'Bills':'Savings & investments'}">${isSav?'&rarr; Bills':'&rarr; Savings'}</button>
        <button class="btn sm danger" data-del-bill="${esc(b.id)}">x</button></td>
    </tr>`;
  }).join('');
  const empty = isSav
    ? 'Nothing put aside yet. Add a savings or investment commitment, or move one across from Bills.'
    : 'No bills yet - add one below, or import your JSON on the Data tab.';
  return `<div class="card">
    <h2>${title} <span class="pill">${rows.length}</span></h2>
    <div class="tw"><table>
      <thead><tr>${sortableTh(kind,'name',isSav?'Commitment':'Bill')}${sortableTh(kind,'freq','Frequency')}${sortableTh(kind,'holder','Holder')}${sortableTh(kind,'amount','Amount','n')}
        ${sortableTh(kind,'annual','Annual','n')}${sortableTh(kind,'monthly','Monthly','n')}${sortableTh(kind,'weekly','Weekly','n')}
        ${sortableTh(kind,'due','Next due')}<th class="n">Upcoming</th><th class="n">Actual /mo</th><th>Budget used</th><th></th></tr></thead>
      <tbody>${body||`<tr><td colspan="12" class="empty">${empty}</td></tr>`}</tbody>
      <tfoot><tr><td>Total</td><td></td><td></td>
        <td class="n">${fmt(rows.reduce((s,b)=>s+num(b.amount),0))}</td>
        <td class="n">${fmt(totals.annual)}</td><td class="n">${fmt(totals.monthly)}</td><td class="n">${fmt(totals.weekly)}</td>
        <td colspan="5"></td></tr></tfoot>
    </table></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" data-add="${kind}">+ Add ${isSav?'commitment':'bill'}</button>
      <button class="btn" data-export="${kind}">Export CSV</button>
    </div>
  </div>`;
}

function barHtml(usePct){
  const p = clamp(usePct,0,160);
  const w = p/160*100;
  const over = usePct>100;
  return `<div class="bar" title="${usePct.toFixed(0)}% of budget">
    <i class="${over?'over':'under'}" style="width:${w}%"></i>
    <b style="left:${100/160*100}%"></b>
    <em>${usePct>999?'-':Math.round(usePct)+'%'}</em></div>`;
}

  $$('[data-extra]',el).forEach(x=> x.onchange=()=>{
    const [li,n] = x.dataset.extra.split('.');
    const l = Y.loans[+li]; l.extras = l.extras||{};
    const v = num(x.value);
    if(v) l.extras[n]=v; else delete l.extras[n];
    save(); render();
  });
  $$('[data-export-loan]',el).forEach(x=> x.onclick=()=>{
    const l = Y.loans[+x.dataset.exportLoan];
    downloadCSV(slug(l.name)+'-schedule.csv', loanCSV(l));
  });
  Y.loans.forEach((l,i)=> chart(()=>{
    const o = schedules[i].orig, p = schedules[i].prop;
    const n = Math.max(o.rows.length, p.rows.length);
    const labels = Array.from({length:n},(_,k)=> (o.rows[k]||p.rows[k]).date.slice(0,7));
    const pad = (rows)=> Array.from({length:n},(_,k)=> rows[k]? rows[k].balance : 0);
    lineChart($('#cLoan'+i), labels, [
      {name:'Current', color:PALETTE[2], values:pad(o.rows)},
      {name:'Proposed', color:PALETTE[0], values:pad(p.rows), fill:true}
    ]);
  }));
}
function addLoan(){
  Y.loans.push({id:uid(), name:'New loan', opening:0, rate:5, freq:'Monthly',
    repayment:0, proposedRepayment:0, startDate:iso(new Date()), endDate:'', extras:{}});
  save(); render();
}

      ${warn.length? `<div class="note" style="color:var(--warn);border-color:var(--warn)">

        ${warn.map(w=> esc(w.year)+' ('+fmt0(w.extra)+' against '+fmt0(w.allowed)+')').join(', ')}.
        That usually triggers a break funding fee, and the amount depends on funding rates on the day, so check
        your loan offer - nothing above accounts for one.</div>`:''}

      <div class="chartbox" style="height:280px"><canvas id="cMort${i}"></canvas></div>
      ${legendHtml([{label:'No overpayments',color:PALETTE[2]},{label:'Plan',color:PALETTE[0]}])}

      <h3 style="margin:16px 0 6px;font-size:14px">Statements <span class="pill">${(m.statements||[]).length}</span></h3>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th class="n">Balance on it</th><th class="n">Adjustment</th>
          <th class="n">Interest on it</th><th class="n">We modelled</th>
          <th class="n">Paid on it</th><th class="n">We modelled</th><th>Note</th><th></th></tr></thead>
        <tbody>${(m.statements||[]).length? (m.statements||[]).map((s,si)=>{
          const row = sch.rows.find(r=> r.statement && s.date && r.date===iso(parseDate(s.date)));
          const adj = row ? row.adjust : null;
          const gap = (row && !blankish(s.interest)) ? round2(num(s.interest) - row.periodInterest) : null;

            <td><input type="date" data-path="mortgages.${i}.statements.${si}.date" value="${esc(s.date||'')}" style="min-width:140px"></td>

            <td class="n ${adj===null||!row?'mut':(Math.abs(adj)<50?'pos':'neg')}">${row? (adj? fmt(adj):'-') : '-'}</td>
            <td class="n"><input class="num" style="text-align:right;width:90px" data-path="mortgages.${i}.statements.${si}.interest" value="${esc(s.interest??'')}" placeholder="optional"></td>
            <td class="n mut">${row? fmt(row.periodInterest) : '-'}${gap!==null&&Math.abs(gap)>=1?` <span class="${Math.abs(gap)<50?'':'neg'}">(${gap>0?'+':''}${fmt(gap)})</span>`:''}</td>
            <td class="n"><input class="num" style="text-align:right;width:90px" data-path="mortgages.${i}.statements.${si}.amount" value="${esc(s.amount??'')}" placeholder="optional"></td>

        }).join('') : `<tr><td colspan="9" class="empty">None yet. A statement is a reading, not a payment - the

      <div class="row" style="margin-top:8px">
        <button class="btn sm" data-add-stmt="${i}">+ Add statement</button>

      <h3 style="margin:16px 0 6px;font-size:14px">Lump sums</h3>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th class="n">Amount</th><th>Note</th><th></th></tr></thead>

          <td class="n"><input class="num" style="text-align:right;width:100px" data-path="mortgages.${i}.lumps.${lx}.amount" data-type="number" value="${num(l.amount)}"></td>

      <div class="row" style="margin-top:8px">

        ${sch.anchors} statement${sch.anchors===1?'':'s'}${sch.anchors?', '+fmt(sch.adjusted)+' adjusted in total':''}</summary>
        <div class="tw" style="max-height:340px;overflow:auto;margin-top:8px"><table>
          <thead><tr><th class="n">#</th><th>Date</th><th></th><th class="n">Rate</th><th class="n">Opening</th>
            <th class="n">Interest</th><th class="n">Principal</th><th class="n">Payment</th>
            ${num(m.insuranceMonthly)>0?'<th class="n">Out</th>':''}
            <th class="n">Extra</th><th class="n">Balance</th></tr></thead>
          <tbody>${sch.rows.map(r=>`<tr>
            <td class="n">${r.n}</td><td>${esc(r.date)}</td>

            <td class="n mut">${ratePct(r.rate)}</td><td class="n">${fmt(r.opening)}</td>
            <td class="n">${fmt(r.interest)}</td><td class="n">${r.statement?'':fmt(r.principal)}</td>
            <td class="n">${r.statement?'':fmt(r.payment)}</td>

        </table></div>

      ${sch.stalled? `<div class="note" style="color:var(--bad)">At that point the repayment stops covering the

        <button class="btn sm" data-export-mort="${i}">Export schedule CSV</button>

  wireFields(el);
  $('#addMortgage').onclick = addMortgage;
  $$('[data-del-mortgage]',el).forEach(x=> x.onclick=()=>{
    const i = +x.dataset.delMortgage;
    if(!confirm('Delete '+(list[i].name||'this mortgage')+', including its statement history?')) return;
    list.splice(i,1); save(); render();
  });
  /* years and months are two boxes over one stored figure, so each one has to read
     the other half back off the total it is editing */
  $$('[data-term]',el).forEach(x=> x.onchange=()=>{
    const parts = x.dataset.term.split('.');
    const m = list[+parts[0]], t = clamp(Math.round(num(m.termMonths)),0,1200);
    const years = parts[1]==='years' ? Math.max(0,Math.round(num(x.value))) : Math.floor(t/12);
    const months = parts[1]==='months' ? Math.max(0,Math.round(num(x.value))) : t%12;
    m.termMonths = clamp(years*12+months, 1, 1200);
    save(); render();
  });
  $$('[data-add-rate]',el).forEach(x=> x.onclick=()=>{
    const m = list[+x.dataset.addRate];
    const rs = mortRates(m), last = rs[rs.length-1];
    /* a new step lands a year after the last one - roughly where a fix rolls off, and
       the date is the first thing you change anyway */
    const from = (last && last.from) ? iso(addMonths(parseDate(last.from),12)) : iso(new Date());
    m.rates.push({id:uid(), from, rate: last? num(last.rate):3.9, kind:'variable'});
    save(); render();
  });
  $$('[data-del-rate]',el).forEach(x=> x.onclick=()=>{
    const p = x.dataset.delRate.split('.').map(Number);
    list[p[0]].rates.splice(p[1],1); save(); render();
  });
  $$('[data-add-stmt]',el).forEach(x=> x.onclick=()=>{
    const m = list[+x.dataset.addStmt];
    m.statements = m.statements||[];
    /* a year on from the last one, since annual is what most lenders send - the balance
       is the only field worth filling in, so everything else starts blank */
    const prev = (m.statements||[]).map(s=>s.date).filter(Boolean).sort().pop();
    const date = prev ? iso(addMonths(parseDate(prev),12)) : iso(new Date());
    m.statements.push({id:uid(), date, amount:'', interest:'', balance:'', note:''});
    save(); render();
  });
  $$('[data-del-stmt]',el).forEach(x=> x.onclick=()=>{
    const p = x.dataset.delStmt.split('.').map(Number);
    list[p[0]].statements.splice(p[1],1); save(); render();
  });
  $$('[data-add-lump]',el).forEach(x=> x.onclick=()=>{
    const m = list[+x.dataset.addLump];
    m.lumps = m.lumps||[];
    m.lumps.push({id:uid(), date: iso(new Date()), amount:0, note:''});
    save(); render();
  });
  $$('[data-del-lump]',el).forEach(x=> x.onclick=()=>{
    const p = x.dataset.delLump.split('.').map(Number);
    list[p[0]].lumps.splice(p[1],1); save(); render();
  });
  $$('[data-export-mort]',el).forEach(x=> x.onclick=()=>{
    const m = list[+x.dataset.exportMort];
    downloadCSV(slug(m.name||'mortgage')+'-schedule.csv', mortgageCSV(m));
  });
  list.forEach((m,i)=> chart(()=>{
    const s = calcs[i].sch, b = calcs[i].base;
    const n = Math.max(s.rows.length, b.rows.length);
    if(!n) return;
    const labels = Array.from({length:n},(_,k)=> (s.rows[k]||b.rows[k]).date.slice(0,7));
    const pad = rows => Array.from({length:n},(_,k)=> rows[k]? rows[k].balance : 0);
    lineChart($('#cMort'+i), labels, [
      {name:'No overpayments', color:PALETTE[2], values:pad(b.rows)},
      {name:'Plan', color:PALETTE[0], values:pad(s.rows), fill:true}
    ]);
  }));
}
function addMortgage(){
  (Y.mortgages || (Y.mortgages=[])).push(blankMortgage());

const TXN_LIMIT = 800;
function txnRows(){
  const cats = Array.from(new Set([...Y.bills.map(b=>b.name), ...Y.rules.map(r=>r.category)])).filter(Boolean).sort();
  return Y.txns.slice().map((t,i)=>({t,i}))
    .sort((a,b)=> (a.t.date<b.t.date?1:-1))
    .slice(0,TXN_LIMIT)
    .map(({t,i})=>`<tr>
      <td>${esc(t.date)}</td><td>${esc(t.desc)}</td>
      <td class="n">${t.debit?fmt(num(t.debit)):''}</td>
      <td class="n pos">${t.credit?fmt(num(t.credit)):''}</td>
      <td class="n mut">${t.balance!==''&&t.balance!=null?fmt(num(t.balance)):''}</td>
      <td class="tap" data-txncat="${i}">${t.category? esc(t.category) : '<span class="mut">uncategorised</span>'}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="empty">No transactions.</td></tr>';
}
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(ch==='\r'){}
      else cell+=ch;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==''));
}
function findCol(headers, ...keys){
  for(const k of keys){
    const i = headers.findIndex(h=> h.toLowerCase().replace(/[^a-z0-9]/g,'').includes(k));
    if(i>=0) return i;
  }
  return -1;
}
function importStatement(text, mode){
  const rows = parseCSV(text);
  if(rows.length<2){ toast('Could not read that CSV'); return; }
  const head = rows[0].map(h=>String(h).trim());
  const ci = {
    date: findCol(head,'date'),
    d1: findCol(head,'description1','description','details','narrative','reference'),
    d2: findCol(head,'description2'),
    d3: findCol(head,'description3'),
    debit: findCol(head,'debitamount','debit','withdrawal','moneyout','paidout'),
    credit: findCol(head,'creditamount','credit','deposit','moneyin','paidin'),
    amount: findCol(head,'amount','value'),
    balance: findCol(head,'balance'),
    type: findCol(head,'transactiontype','type')
  };
  if(ci.date<0 || ci.d1<0){ toast('Need at least a date and description column'); return; }
  const out=[];
  for(let r=1;r<rows.length;r++){
    const c = rows[r];
    const d = parseDate(normDate(c[ci.date]));
    if(!d) continue;
    let debit = ci.debit>=0? num(c[ci.debit]) : 0;
    let credit = ci.credit>=0? num(c[ci.credit]) : 0;
    if(ci.debit<0 && ci.credit<0 && ci.amount>=0){
      const a = num(c[ci.amount]);
      if(a<0) debit = Math.abs(a); else credit = a;
    }
    out.push({
      date: iso(d),
      desc: (c[ci.d1]||'').trim(),
      desc2: [ci.d2>=0?c[ci.d2]:'', ci.d3>=0?c[ci.d3]:''].filter(Boolean).join(' ').trim(),
      debit: debit||0, credit: credit||0,
      balance: ci.balance>=0? num(c[ci.balance]) : '',
      type: ci.type>=0? (c[ci.type]||'').trim() : '',
      category: ''
    });
  }
  if(!out.length){ toast('No rows recognised'); return; }
  if(mode==='replace') Y.txns = out;
  else {
    const seen = new Set(Y.txns.map(keyOf));
    let added=0;
    out.forEach(t=>{ if(!seen.has(keyOf(t))){ Y.txns.push(t); seen.add(keyOf(t)); added++; } });
    toast(added+' new transactions added ('+(out.length-added)+' duplicates skipped)');
  }
  const n = applyRules(false);
  save(); render();
  if(mode==='replace') toast(out.length+' transactions imported, '+n+' categorised');
}
const keyOf = t => [t.date,t.desc,t.debit,t.credit,t.balance].join('|');
function normDate(s){
  s = String(s||'').trim();
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`; }
  return s;
}

      <label class="f" style="width:200px"><span>Category</span>
        <select id="hSel">${cats.map(c=>`<option ${c===(histSel||cats[0])?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    </div>
    <div class="chartbox"><canvas id="cHist"></canvas></div>
  </div>`:''}

  <div class="card">
    <h2>Log <span class="pill">${h.length}</span></h2>
    <div class="tw" style="max-height:480px;overflow:auto"><table>
      <thead><tr><th>Month</th>${cats.map(c=>`<th class="n">${esc(c)}</th>`).join('')}<th class="n">Total</th></tr></thead>
      <tbody>${months.slice().reverse().map(m=>{
        const row = grid[m]||{};
        const tot = Object.values(row).reduce((a,b)=>a+b,0);
        return `<tr><td>${esc(m)}</td>${cats.map(c=>`<td class="n">${row[c]?fmt(row[c]):'<span class="mut">-</span>'}</td>`).join('')}
          <td class="n"><b>${fmt(tot)}</b></td></tr>`;
      }).join('') || `<tr><td colspan="${cats.length+2}" class="empty">Nothing logged yet.</td></tr>`}</tbody>
      <tfoot><tr><td>Average / month</td>${cats.map(c=>{
        const ms = months.filter(m=>grid[m]&&grid[m][c]!=null).length||1;
        return `<td class="n">${fmt(catTotal(c)/ms)}</td>`;
      }).join('')}<td></td></tr></tfoot>
    </table></div>
  </div>`;

  $('#hAdd').onclick = ()=>{
    const m = $('#hMonth').value, c = $('#hCat').value.trim(), a = num($('#hAmt').value);
    if(!m||!c){ toast('Month and category needed'); return; }
    Y.history.push({month:m, category:c, amount:a});
    save(); render();
  };
  $('#hFromTxns').onclick = ()=>{
    const seen = new Set(Y.history.map(r=>r.month+'|'+r.category));
    const agg = {};
    Y.txns.filter(t=>t.category && num(t.debit)>0).forEach(t=>{
      const k = t.date.slice(0,7)+'|'+t.category;
      agg[k] = (agg[k]||0)+num(t.debit);
    });
    let n=0;
    Object.entries(agg).forEach(([k,v])=>{
      if(seen.has(k)) return;
      const [month,category]=k.split('|');
      Y.history.push({month, category, amount:round2(v)}); n++;
    });
    save(); render(); toast(n+' months added from transactions');
  };
  $('#exportHistory').onclick = ()=> downloadCSV('history-'+yearLabel()+'.csv', historyCSV());
  $('#hImport').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const rows = parseCSV(rd.result);
      e.target.value = '';
      if(!rows.length){ toast('Nothing in that file'); return; }
      const head = rows[0].map(h=>String(h).trim().toLowerCase());
      const iM = head.findIndex(h=>h.includes('month'));
      const iC = head.findIndex(h=>h.includes('categ'));
      const iA = head.findIndex(h=>h.includes('amount'));
      if(iM<0||iC<0||iA<0){ toast('Need Month, Category and Amount columns'); return; }
      const out = [];
      for(let r=1;r<rows.length;r++){
        const c = rows[r];
        const m = String(c[iM]||'').trim().slice(0,7);
        const cat = String(c[iC]||'').trim();
        if(!/^\d{4}-\d{2}$/.test(m) || !cat) continue;
        out.push({month:m, category:cat, amount:num(c[iA])});
      }
      if(!out.length){ toast('No usable rows - months need to look like 2026-03'); return; }
      if(Y.history.length && !confirm('Replace all '+Y.history.length+' existing history rows with '+out.length+' from this file?')) return;
      Y.history = out;
      save(); render();
      toast(out.length+' history rows imported');
    };
    rd.onerror = ()=>{ toast('Could not read that file'); e.target.value=''; };
    rd.readAsText(f);
  };
  const sel = $('#hSel');
  if(sel){
    sel.onchange = ()=>{ histSel = sel.value; render(); };
    chart(()=>{
      const c = histSel||cats[0];
      const ms = months.filter(m=>grid[m]&&grid[m][c]!=null);
      lineChart($('#cHist'), ms, [{name:c, color:PALETTE[0], values:ms.map(m=>grid[m][c]), fill:true}]);
    });
  }
}

/* swap an item with its neighbour; returns false at either end so callers can skip re-rendering */
function moveItem(arr, i, dir){
  const j = i + dir;
  if(j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  return true;
}

/* ---------------- electricity ---------------- */
function profileKpis(s){
  const pr = s.profile || [], mins = s.intervalMins||30;
  const perDay = pr.reduce((a,b)=>a+b,0);
  let hi = 0; pr.forEach((v,i)=>{ if(v>pr[hi]) hi=i; });
  const at = i => String(Math.floor(i*mins/60)).padStart(2,'0')+':'+String((i*mins)%60).padStart(2,'0');
  const share = v => pct(s.total ? v/s.total*100 : 0);
  return `
    <div class="kpi"><div class="lbl">Typical day</div><div class="val">${perDay.toFixed(1)}</div>
      <div class="sub">kWh</div></div>
    <div class="kpi"><div class="lbl">Busiest half hour</div><div class="val">${at(hi)}</div>
      <div class="sub">${(pr[hi]||0).toFixed(2)} kWh on average</div></div>
    <div class="kpi"><div class="lbl">Used at night</div><div class="val pos">${share(s.night)}</div>
      <div class="sub">cheapest rate</div></div>
    <div class="kpi"><div class="lbl">Used at peak</div><div class="val ${s.total&&s.peak/s.total>0.2?'neg':''}">${share(s.peak)}</div>
      <div class="sub">dearest rate</div></div>`;
}

  </div>`:''}

  ${s?`
  <div class="card">
    <h2>Usage by month</h2>
    <div class="chartbox" style="height:280px"><canvas id="cUsage"></canvas></div>
    ${legendHtml([{label:'Day',color:PALETTE[1]},{label:'Night',color:PALETTE[3]},{label:'Peak',color:PALETTE[2]},{label:'Total',color:css('--text')}])}
    <div class="tw" style="max-height:340px;overflow:auto;margin-top:10px"><table>
      <thead><tr><th>Month</th><th class="n">Day</th><th class="n">Night</th><th class="n">Peak</th><th class="n">Total kWh</th>
        ${current&&current.c?`<th class="n">Cost on ${esc(current.o.name)}</th>`:''}</tr></thead>
      <tbody>${s.byMonth.map(m=>{
        const c = current ? (m.day*num(current.o.day)+m.night*num(current.o.night)+m.peak*num(current.o.peak))/100 : null;
        return `<tr><td>${esc(m.month)}</td><td class="n">${num(m.day).toFixed(1)}</td><td class="n">${m.night.toFixed(1)}</td>
          <td class="n">${m.peak.toFixed(1)}</td><td class="n"><b>${m.total.toFixed(1)}</b></td>
          ${current&&current.c?`<td class="n">${fmt(c + num(current.o.standing)/12)}</td>`:''}</tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="n">${s.day.toFixed(1)}</td><td class="n">${s.night.toFixed(1)}</td>
        <td class="n">${s.peak.toFixed(1)}</td><td class="n">${s.total.toFixed(1)}</td>
        ${current&&current.c?`<td class="n">${fmt(current.c.annual)}</td>`:''}</tr></tfoot>
    </table></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="exportUsage">Export CSV</button></div>
  </div>

  ${s.profile && s.profile.length ? `<div class="card">
    <h2>Your average day</h2>
    <div class="chartbox" style="height:280px"><canvas id="cProfile"></canvas></div>
    ${legendHtml([{label:'Day',color:PALETTE[1]},{label:'Night',color:PALETTE[3]},{label:'Peak',color:PALETTE[2]}])}
    <div class="grid g4" style="margin-top:12px">${profileKpis(s)}</div>
    <div class="note">Averaged over every day in the period. The shaded areas are the night and peak windows - the more
      usage you can shift out from under the peak shading, the better a day/night/peak plan pays off for you.</div>
  </div>` : `<div class="card"><div class="note" style="margin:0">Re-import your HDF file to get the average-day
    chart - the profile was added after this summary was saved.</div></div>`}`:''}`;

  wireFields(el);
  $('#hdfFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    setStatus('Reading '+f.name+'...');
    const rd = new FileReader();
    rd.onload = ()=>{
      const out = summariseUsage(rd.result, Y.energy.bands);
      e.target.value = '';
      if(out.error){ setStatus('Ready'); toast(out.error); return; }
      Y.energy.summary = out;
      if(out.mprn && !String(Y.energy.mprn||'').trim()) Y.energy.mprn = out.mprn;
      save(); render();
      toast(Math.round(out.total).toLocaleString('en-IE')+' kWh summarised from '+out.intervals.toLocaleString('en-IE')+' readings');
    };
    rd.onerror = ()=>{ setStatus('Ready'); toast('Could not read that file'); e.target.value=''; };
    rd.readAsText(f);
  };
  $('#mprnField').onchange = e=>{
    Y.energy.mprn = e.target.value.replace(/\s+/g,'').slice(0,16);
    save(); render();
  };
  $('#copyMprn').onclick = ()=>{
    const v = String(Y.energy.mprn||'').trim();
    if(!v){ toast('No MPRN saved yet'); return; }
    if(navigator.clipboard) navigator.clipboard.writeText(v).then(()=>toast('MPRN copied'), ()=>toast(v));
    else toast(v);
  };
  if($('#clearUsage')) $('#clearUsage').onclick = ()=>{
    if(confirm('Clear the saved usage summary?')){ Y.energy.summary = null; save(); render(); }
  };
  if($('#recalc')) $('#recalc').onclick = ()=> toast('Re-import the HDF file to re-band accurately');
  $('#addOffer').onclick = ()=>{
    Y.energy.offers.push({id:uid(), name:'New offer', day:0, night:0, peak:0, standing:0, discount:0, incVat:true});
    save(); render();
  };
  $('#flatOffer').onclick = ()=>{
    const r = num(prompt('Single 24-hour rate in cent per kWh:', '25.86'));
    Y.energy.offers.push({id:uid(), name:'Flat rate plan', day:r, night:r, peak:r, standing:0, discount:0, incVat:true});
    save(); render();
  };
  $$('[data-del-offer]',el).forEach(x=> x.onclick=()=>{ Y.energy.offers.splice(+x.dataset.delOffer,1); save(); render(); });
  $$('[data-current]',el).forEach(x=> x.onchange=()=>{
    Y.energy.offers.forEach((o,i)=> o.current = (i === +x.dataset.current));
    save(); render();
  });
  $('#exportOffers').onclick = ()=> downloadCSV('electricity-offers-'+yearLabel()+'.csv', offersCSV());
  if($('#exportUsage')) $('#exportUsage').onclick = ()=> downloadCSV('electricity-usage-'+yearLabel()+'.csv', usageCSV());

  /* offer comparison needs priced offers; usage and profile only need a summary */
  if(s && valid.length) chart(()=>{
    const sorted = valid.slice().sort((a,b)=>a.c.annual-b.c.annual);
    hBars($('#cOffers'), sorted.map(x=>x.o.name+(x.o.current?' (current)':'')), [
      {name:'Per year', color:PALETTE[0], values:sorted.map(x=>x.c.annual)}
    ]);
    hBars($('#cBands'), sorted.map(x=>x.o.name), [
      {name:'Day', color:PALETTE[1], values:sorted.map(x=>x.c.dayCost)},
      {name:'Night', color:PALETTE[3], values:sorted.map(x=>x.c.nightCost)},
      {name:'Peak', color:PALETTE[2], values:sorted.map(x=>x.c.peakCost)}
    ]);
  });

  if(s){
    chart(()=>{
      if(s.profile && s.profile.length && $('#cProfile')){
        profileChart($('#cProfile'), s.profile, Y.energy.bands, s.intervalMins||30,
          {day:PALETTE[1], night:PALETTE[3], peak:PALETTE[2]});
      }
      lineChart($('#cUsage'), s.byMonth.map(m=>m.month), [
        {name:'Day', color:PALETTE[1], values:s.byMonth.map(m=>m.day)},
        {name:'Night', color:PALETTE[3], values:s.byMonth.map(m=>m.night)},
        {name:'Peak', color:PALETTE[2], values:s.byMonth.map(m=>m.peak)},
        {name:'Total', color:css('--text'), values:s.byMonth.map(m=>m.total), dash:true}
      ], {axisFormat: v=>Math.round(v).toString(), tipFormat: v=>v.toFixed(1)+' kWh'});
    });
  }
}

/* ---------------- maternity tab ---------------- */

  const phases = M.employerPhases||[];

    const from = weekCursor + 1;
    weekCursor += num(ph.weeks);

    const weekly = plan ? phaseWeekly(ph, plan.grossWeekly, plan.stateWeekly, from <= num(M.stateWeeks)) : 0;
    return `<tr>
      <td class="n mut">Weeks ${from}-${to}</td>

      to predict it.</div>
  </div>`;

  wireMaternity(el);
  chart(()=>{
    lineChart($('#cMat'), p.months.map(m=>m.key), [
      {name:'Their take-home', color:PALETTE[0], values:p.months.map(m=>m.actual), fill:true},
      {name:'Normal take-home', color:PALETTE[9], values:p.months.map(m=>m.normalNet), dash:true},
      {name:'Household in', color:PALETTE[5], values:p.months.map(m=>m.householdIn)},
      {name:'Bills + savings', color:PALETTE[2], values:p.months.map(m=>m.outflow), dash:true}
    ]);
  });
}

function wireMaternity(el){
  const M = Y.maternity;
  wireFields(el);
  $$('[data-preset]',el).forEach(b=> b.onclick = ()=>{
    const [paid,unpaid] = b.dataset.preset.split(',').map(Number);
    M.paidWeeks = paid; M.unpaidWeeks = unpaid; save(); render();
  });
  if($('#addPhase')) $('#addPhase').onclick = ()=>{
    const used = (M.employerPhases||[]).reduce((s,p)=>s+num(p.weeks),0);
    const left = Math.max(1, num(M.paidWeeks)+num(M.unpaidWeeks) - used);
    M.employerPhases.push({id:uid(), weeks:left, mode:'topup', amount:0});
    save(); render();
  };
  if($('#quickFull')) $('#quickFull').onclick = ()=>{
    M.employerPhases = [{id:uid(), weeks:26, mode:'topup', amount:0}]; save(); render();
  };
  if($('#quickHalf')) $('#quickHalf').onclick = ()=>{
    M.employerPhases = [{id:uid(), weeks:12, mode:'topup', amount:0},
                        {id:uid(), weeks:14, mode:'percent', amount:50}];
    save(); render();
  };
  $$('[data-del-phase]',el).forEach(b=> b.onclick = ()=>{
    M.employerPhases.splice(+b.dataset.delPhase,1); save(); render();
  });
}

/* ---------------- contract renewals ---------------- */

function renderRenewals(el){
  const R = Y.renewals;
  const items = R.items;
  const billNames = Y.bills.map(b=>b.name).filter(Boolean);

  const rows = items.map((c,i)=>{
    const d = daysUntil(c.end);
    const pill = d===null ? '<span class="mut">no date</span>'
      : d < 0 ? '<span class="pill" style="border-color:var(--bad);color:var(--bad)">expired</span>'
      : d <= 7 ? `<span class="pill" style="border-color:var(--bad);color:var(--bad)">${d}d</span>`
      : d <= 30 ? `<span class="pill" style="border-color:var(--warn);color:var(--warn)">${d}d</span>`
      : d <= 60 ? `<span class="pill on">${d}d</span>`
      : `<span class="pill">${d}d</span>`;
    return `<tr>
      <td><input data-path="renewals.items.${i}.name" value="${esc(c.name)}" placeholder="Broadband" list="billNameList"></td>
      <td><input data-path="renewals.items.${i}.provider" value="${esc(c.provider)}" placeholder="Siro"></td>

/* ---------------- export helpers ---------------- */
const slug = s => String(s||'sheet').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sheet';
/* A cell starting = + - @ (or a leading tab/CR) is executed as a formula by Excel,
   Sheets and LibreOffice. A bill named =HYPERLINK(...) would fire on open, so any
   text cell that starts with one is prefixed with an apostrophe on the way out. */
function csvSafe(v){
  const s = (v===null||v===undefined)?'':String(v);
  if(typeof v === 'number') return s;
  return /^[=+\-@\t\r]/.test(s) && !/^-?\d*\.?\d+$/.test(s) ? "'"+s : s;
}
function toCSV(rows){
  return rows.map(r=> r.map(c=>{
    const s = csvSafe(c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
}
function downloadBlob(name, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}
function downloadCSV(name, rows){ downloadBlob(name, new Blob(['\uFEFF'+toCSV(rows)],{type:'text/csv;charset=utf-8'})); }
function downloadText(name, text, type){ downloadBlob(name, new Blob([text],{type:type||'application/json'})); }

/* ---------------- minimal xlsx writer (store-only zip, inline strings) ---------------- */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const enc = s => new TextEncoder().encode(s);
function zipStore(files){
  const chunks=[], central=[]; let offset=0;
  const dv = n => { const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b; };
  const sv = n => { const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; };
  for(const f of files){
    const name = enc(f.name), data = f.data;
    const crc = crc32(data);
    const local = [enc('PK\x03\x04'), sv(20), sv(0), sv(0), sv(0), sv(0), dv(crc), dv(data.length), dv(data.length), sv(name.length), sv(0), name, data];
    local.forEach(x=>chunks.push(x));
    central.push([enc('PK\x01\x02'), sv(20), sv(20), sv(0), sv(0), sv(0), sv(0), dv(crc), dv(data.length), dv(data.length),
      sv(name.length), sv(0), sv(0), sv(0), sv(0), dv(0), dv(offset), name]);
    offset += 30 + name.length + data.length;
  }
  const cdStart = offset; let cdSize = 0;
  central.forEach(parts=>{ parts.forEach(p=>{ chunks.push(p); cdSize += p.length; }); });
  chunks.push(enc('PK\x05\x06'), sv(0), sv(0), sv(files.length), sv(files.length), dv(cdSize), dv(cdStart), sv(0));
  let total=0; chunks.forEach(c=>total+=c.length);
  const out = new Uint8Array(total); let pos=0;
  chunks.forEach(c=>{ out.set(c,pos); pos+=c.length; });
  return out;
}
const xmlEsc = s => String(s)
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')   // illegal in XML 1.0 - would corrupt the workbook
  .replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]));
function colName(i){ let s=''; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXml(rows){
  const body = rows.map((r,ri)=>{
    const cells = r.map((v,ci)=>{
      const ref = colName(ci)+(ri+1);
      if(v===null||v===undefined||v==='') return '';
      if(typeof v==='number' && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(csvSafe(v))}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(sheets){
  const names = [], used = new Set();
  sheets.forEach(s=>{
    let n = String(s.name).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31) || 'Sheet';
    let base=n, k=2; while(used.has(n)){ n = (base.slice(0,28)+' '+k++); }
    used.add(n); names.push(n);
  });
  const files = [];
  files.push({name:'[Content_Types].xml', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`)});
  files.push({name:'_rels/.rels', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)});
  files.push({name:'xl/workbook.xml', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${names.map((n,i)=>`<sheet name="${xmlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)});
  files.push({name:'xl/_rels/workbook.xml.rels', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${names.map((n,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
</Relationships>`)});
  sheets.forEach((s,i)=> files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:enc(sheetXml(s.rows))}));
  return zipStore(files);
}
function downloadXlsx(name, sheets){
  downloadBlob(name, new Blob([buildXlsx(sheets)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

    ${!blank ? `<div class="row" style="margin-top:2px">
      <button class="btn" id="loadDemo2">Load demo data instead</button>
      <span class="note" style="margin:0">Replaces ${esc(Y.year)} with the fictional demo household - your data stays in the other years.</span>
    </div>`:''}
  </div>

  <div class="card">
    <h2>Optional tabs</h2>
    <label style="display:block"><input type="checkbox" id="matToggle" ${Y.maternity.enabled?'checked':''}>
      Maternity leave planner</label>
    <div class="note">Models a period of leave against your budget - state benefit, employer top-up and the
      shortfall each month. Off by default so the tab bar stays short.</div>
  </div>

  <div class="card">
    <h2>Years</h2>
    <div class="tw"><table>
      <thead><tr><th>Year</th><th class="n">Bills</th><th class="n">Loans</th><th class="n">Transactions</th><th class="n">Budget /mo</th><th></th></tr></thead>
      <tbody>${Object.keys(DB.years).sort().map(y=>{
        const d = DB.years[y];
        const ann = d.bills.reduce((s,b)=> s+num(b.amount)*(FREQ[b.freq]||12), 0);
        return `<tr><td>${esc(yearLabel(d))} ${y===DB.active?'<span class="pill on">active</span>':''}</td>
          <td class="n">${d.bills.length}</td><td class="n">${d.loans.length}</td><td class="n">${d.txns.length}</td>
          <td class="n">${fmt(ann/12)}</td>
          <td class="act">${Object.keys(DB.years).length>1?`<button class="btn sm danger" data-del-year="${y}">Delete</button>`:''}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="newYear2">+ New year from ${esc(yearLabel())}</button>
      <button class="btn" id="dupYear">Duplicate ${esc(yearLabel())}</button>
      <div class="spacer"></div>
      <label class="f" style="width:110px;margin:0"><span>Currency</span><input data-path="currency" value="${esc(Y.currency)}" maxlength="3"></label>
    </div>
  </div>

  <div class="card">
    <h2>Danger zone</h2>
    <button class="btn danger" id="wipe">Erase everything in this browser</button>
    <div class="note">Data lives only in this browser's local storage. Clearing site data removes it. Keep a JSON backup.</div>
  </div>`;

  wireFields(el);
  $('#expXlsx').onclick = ()=>{ downloadXlsx('finances-'+yearLabel()+'.xlsx', allSheets()); toast('Workbook downloaded'); };
  $('#expJson').onclick = ()=> downloadText('ledger-'+yearLabel()+'.json', JSON.stringify({kind:'ledger-year', year:Y.year, label:yearLabel(), data:Y}, null, 2));
  $('#expAll').onclick = ()=> downloadText('ledger-all-years.json', JSON.stringify(DB, null, 2));
  $('#expAllCsv').onclick = ()=>{
    const s = allSheets();
    s.forEach((sh,i)=> setTimeout(()=> downloadCSV(slug(sh.name)+'-'+yearLabel()+'.csv', sh.rows), i*350));
    toast('Downloading '+s.length+' files');
  };
  $('#impJson').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      /* Parsing and rendering are kept in separate try/catches. A JSON syntax error
         and a render-time crash from a missing field look identical to the person
         picking a file - they deserve different messages, and a render problem
         should not be blamed on a file that parsed perfectly well. */
      let parsedOk = false, n = 0;
      try{
        const j = JSON.parse(rd.result);
        if(j.kind==='ledger-year' && j.data){
          const yr = parseInt(j.year,10) || parseInt(j.data.year,10) || new Date().getFullYear();
          const key = String(j.label || j.data.label || yr);
          DB.years[key] = j.data; DB.active = key;
        } else if(j.years && typeof j.years==='object' && Object.keys(j.years).length){
          DB = j; if(!DB.years[DB.active]) DB.active = Object.keys(DB.years)[0];
        } else { toast('That doesn\'t look like a Ledger backup file'); e.target.value=''; return; }
        Object.values(DB.years).forEach(migrate);
        Y = DB.years[DB.active]; CUR = safeCur(Y.currency);
        n = Y.txns.filter(t=>t.category).length;
        parsedOk = true;
      }catch(err){
        console.warn('Restore: file did not parse as JSON', err);
        toast('That file would not parse as JSON');
      }
      e.target.value = '';
      if(!parsedOk) return;
      try{
        save(); render();
        toast('Restored'+(n?' - '+n+' transactions categorised':''));
      }catch(err){
        console.warn('Restore: file parsed but a tab failed to render', err);
        active = 'dashboard';
        try{ render({reset:true}); }catch(e2){ console.warn('Restore: dashboard also failed to render', e2); }
        toast('Restored, but something in that file looked odd - check the Budget and Tax tabs');
      }
    };
    rd.onerror = ()=>{ toast('Could not read that file'); e.target.value=''; };
    rd.readAsText(f);
  };
  $$('[data-del-year]',el).forEach(x=> x.onclick=()=>{
    const y = x.dataset.delYear;
    if(!confirm('Delete '+y+' permanently?')) return;
    delete DB.years[y];
    if(DB.active===y) DB.active = Object.keys(DB.years).sort()[0];
    Y = DB.years[DB.active]; save(); render();
  });
  $('#newYear2').onclick = newYear;
  $('#dupYear').onclick = duplicateYear;
  const loadDemo = ()=>{
    if(!isBlankYear(Y) && !confirm('This replaces everything entered for '+yearLabel()+' with the fictional demo data. Continue?')) return;
    try{
      const data = JSON.parse(DEMO_YEAR_JSON);
      data.year = Y.year;   // land it under whichever year slot is open, not always 2026
      DB.years[DB.active] = data;
      migrate(DB.years[DB.active]);
      Y = DB.years[DB.active]; CUR = safeCur(Y.currency);
      save(); render();
      toast('Demo data loaded');
    }catch(err){ console.warn('Load demo failed', err); toast('Could not load the demo data'); }
  };
  if($('#loadDemo')) $('#loadDemo').onclick = loadDemo;
  if($('#loadDemo2')) $('#loadDemo2').onclick = loadDemo;
  $('#matToggle').onchange = e=>{
    Y.maternity.enabled = e.target.checked;
    save(); render();
    if(e.target.checked) toast('Maternity tab added');
  };
  $('#wipe').onclick = ()=>{
    if(!confirm('Erase all years from this browser? Export a backup first.')) return;
    localStorage.removeItem(KEY); load(); render(); toast('Cleared');
  };
}

/* ---------------- year management ---------------- */
/* A full copy of the current year under a new label - for "what if things change in
   March" scenarios, or just a safe sandbox to try figures in. Everything comes across,
   transactions included, because the point is to compare like with like. */
function duplicateYear(){
  const suggested = yearKey(yearLabel()+'-2');
  const input = prompt('Name for the copy (everything in '+yearLabel()+' is copied across):', suggested);
  if(input===null) return;
  const label = String(input).trim();
  if(!label){ toast('Needs a name'); return; }
  const key = yearKey(label);
  const copy = JSON.parse(JSON.stringify(Y));
  copy.label = label;
  DB.years[key] = copy;
  DB.active = key;
  Y = copy; CUR = safeCur(Y.currency);
  save(); render();
  toast('Copied to '+label);
}
function newYear(){
  const years = Object.keys(DB.years).map(Number);
  const suggested = Math.max(...years)+1;
  const input = prompt('New year to create (bills, loans, mortgage, savings and rules carry over):', suggested);
  if(!input) return;
  const y = parseInt(input,10);
  if(!y || y<1990 || y>2200){ toast('Enter a year like '+suggested); return; }
  if(DB.years[y] && !confirm(y+' already exists. Overwrite it?')) return;
  const src = Y;
  const seed = {
    people: JSON.parse(JSON.stringify(src.people)),
    bills: JSON.parse(JSON.stringify(src.bills)),
    loans: JSON.parse(JSON.stringify(src.loans)),
    mortgages: JSON.parse(JSON.stringify(src.mortgages||[])),
    savings: JSON.parse(JSON.stringify(src.savings)),
    rules: JSON.parse(JSON.stringify(src.rules)),
    history: JSON.parse(JSON.stringify(src.history)),
    accounts: JSON.parse(JSON.stringify(src.accounts||[])),
    payees: JSON.parse(JSON.stringify(src.payees||[])),
    energy: JSON.parse(JSON.stringify(src.energy||blankEnergy())),
    maternity: JSON.parse(JSON.stringify(src.maternity||blankMaternity()))
  };
  if(seed.energy) seed.energy.summary = null;   // new year, re-import the usage file
  const nd = blankYear(y, seed);
  const p = presetFor(y);
  nd.people.forEach(pp=>{
    pp.srcop = p.srcopSingle;
    (pp.credits||[]).forEach(c=>{
      if(/personal/i.test(c.name)) c.amount = p.personalCredit;
      if(/employee|paye/i.test(c.name)) c.amount = p.employeeCredit;
    });
  });
  nd.savings.startDate = y+'-01-01';
  nd.splitMode = src.splitMode; nd.splitManual = JSON.parse(JSON.stringify(src.splitManual||{}));
  nd.lodgeIncludesSavings = src.lodgeIncludesSavings!==false;
  nd.currency = src.currency;
  DB.years[String(y)] = nd;
  DB.active = String(y);
  Y = nd; save(); render();
  toast(y+' created - transactions start empty');
}

/* ---------------- init ---------------- */
function applyTheme(){
  document.documentElement.dataset.theme = DB.theme||'dark';
  $('#themeBtn').textContent = (DB.theme==='light')?'Dark':'Light';
}
function init(){
  load();
  applyTheme();
  render();
  $('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(b.dataset.tab); });
  $('#yearSel').onchange = e=>{ DB.active = e.target.value; Y = DB.years[DB.active]; CUR = safeCur(Y.currency); save(); render(); };
  $('#newYear').onclick = newYear;
  $('#themeBtn').onclick = ()=>{ DB.theme = (DB.theme==='light')?'dark':'light'; applyTheme(); save(true); render(); };
  window.addEventListener('resize', redrawCharts);
  /* the write is debounced, so make sure it lands if the tab is closed straight after an edit */
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSave(); });
  setStatus('Ready');
  /* localStorage has already rendered above, so the page is never blank while this is in
     flight, and on anything but a ledger server it does nothing at all. */
  initSync();
}
init();
</script></body></html>
