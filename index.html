<meta name="color-scheme" content="dark light">
<style>
:root{
  --bg:#101319; --surface:#171b23; --surface2:#1d222c; --line:#282f3b;
  --text:#e3e8f0; --muted:#8a94a5; --accent:#4fb3a3; --accent-dim:#2f6b62;
  --good:#6faf6c; --warn:#d6a544; --bad:#d0625d; --shadow:0 1px 2px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#f4f6f8; --surface:#ffffff; --surface2:#f0f2f5; --line:#dde2e9;
  --text:#161a21; --muted:#68727f; --accent:#2b8579; --accent-dim:#a8d5cd;
  --good:#3f7f3d; --warn:#a97b16; --bad:#b8433d; --shadow:0 1px 2px rgba(20,25,35,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.num,input[type=number],td.n,th.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:600;margin:0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* top bar */
header{
  position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;
}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.brand span{color:var(--accent)}
header .grow{flex:1}
.status{font-size:12px;color:var(--muted)}

nav{display:flex;gap:2px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:47px;z-index:29}
nav button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:10px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;
}
nav button:hover{color:var(--text)}
nav button.active{color:var(--text);border-bottom-color:var(--accent)}

main{padding:16px;max-width:1400px;margin:0 auto}
section{display:none}
section.active{display:block}

/* controls */
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--text)}
.btn{
  background:var(--surface2);border:1px solid var(--line);border-radius:6px;
  padding:6px 11px;cursor:pointer;
}
.btn:hover{border-color:var(--accent-dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08110f;font-weight:600}
[data-theme="light"] .btn.primary{color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.32;cursor:default;pointer-events:none}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
label.f{display:block;margin-bottom:9px}
label.f>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}

/* layout blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.spacer{flex:1}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-size:22px;font-weight:600;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)} .amb{color:var(--warn)} .mut{color:var(--muted)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
/* nowrap matches th below: every table in the app scrolls horizontally rather than
   wrapping, and without this a plain text cell containing a space (a masked IBAN, a
   merchant description) could collapse to its narrowest word and stretch the whole
   row tall instead of just scrolling sideways like everything else does */
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th.n,td.n{text-align:right}
tbody tr:hover{background:var(--surface2)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
table input,table select{padding:3px 5px;min-width:70px}
td.act{width:1%;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}

/* signature: budget bar */
.bar{position:relative;height:16px;background:var(--surface2);border-radius:3px;min-width:110px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-dim);border-radius:3px}
.bar i.over{background:var(--bad)}
.bar i.under{background:var(--accent-dim)}
.bar b{position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--text);opacity:.55}
.bar em{position:absolute;right:4px;top:0;font-style:normal;font-size:10.5px;line-height:16px;color:var(--text);font-family:ui-monospace,Menlo,monospace}

.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
/* click-to-edit cell: an <input> per row is what made the transaction table slow to
   render, so the value sits as text until you actually click it */
td.tap{cursor:text;min-width:110px}
td.tap:hover{background:var(--surface2);border-radius:4px}
.pill.on{border-color:var(--accent-dim);color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
canvas{display:block;max-width:100%}
.chartbox{height:260px;position:relative;overflow:hidden}
.chartbox.auto{height:auto}
.tip{
  position:absolute;pointer-events:none;z-index:5;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.3);color:var(--text);
}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px;color:var(--muted);font-size:11px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);
  border:1px solid var(--accent-dim);border-radius:8px;padding:9px 16px;z-index:99;box-shadow:0 6px 22px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .18s
}
.toast.show{opacity:1}
details summary{cursor:pointer;color:var(--muted);font-size:12px;padding:4px 0}
@media (max-width:640px){
  main{padding:10px}
  .card{padding:11px}
  nav{top:45px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header>
  <div class="brand">Led<span>ger</span></div>
  <select id="yearSel" style="width:auto"></select>

  <div class="grow"></div>
  <span class="status" id="status"></span>

</header>
<nav id="tabs"></nav>
<main>

</main>

<script>
/* ---------------------------------------------------------------
   Ledger - single file personal finance workbook
   All data stays in this browser (localStorage). No network calls.
----------------------------------------------------------------*/
"use strict";

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = ()=> Math.random().toString(36).slice(2,9);
const clamp = (n,a,b)=> Math.min(b,Math.max(a,n));
const num = v => { const n = parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; };
const round2 = n => Math.round((n+Number.EPSILON)*100)/100;
/* "left empty" has to stay distinguishable from "entered as zero" on the mortgage
   statement fields, where blank means "work it out" and 0 means "the lender charged 0". */
const blankish = v => v===''||v===null||v===undefined;

const FREQ = {Weekly:52, Fortnightly:26, Monthly:12, Quarterly:4, Annual:1};

let CUR = '€';
const fmt = (n,d)=>{
  if(!isFinite(n)) n=0;
  const s = Math.abs(n).toLocaleString('en-IE',{minimumFractionDigits:d??2,maximumFractionDigits:d??2});
  return (n<0?'-':'')+CUR+s;
};
const fmt0 = n => fmt(n,0);
const pct = n => (isFinite(n)?n:0).toLocaleString('en-IE',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
/* Mortgage rates are quoted to two places and the second one matters: 3.65% rounded
   to 3.7% is a different product, and a different repayment. */
const ratePct = n => (isFinite(n)?n:0).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
/* Dates are handled entirely in local time: a bare "2026-03-01" parses to local
   midnight and iso() reads the local components back. Mixing the two - parsing as UTC
   the way `new Date('2026-03-01')` does, then formatting with toISOString() - shifted
   every date addMonths() pushed across the GMT/IST boundary back by a day, so a loan
   starting on the 15th produced payments on the 15th in winter and the 14th in summer,
   and the day count either side of the change was wrong with it. */
const iso = d => {
  const x = (d instanceof Date)?d:new Date(d);
  if(isNaN(x)) return '';
  const p = n => String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
};
const parseDate = s => {
  if(s instanceof Date) return isNaN(s)?null:s;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s??'').trim());
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);      // local midnight, not UTC midnight
  const d = new Date(s);
  return isNaN(d)?null:d;
};
const addMonths = (d,n)=>{ const x=new Date(d.getTime()); const day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n);
  x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); return x; };
const addDays = (d,n)=>{ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b)=> Math.round((b-a)/86400000);
const monthKey = d => iso(d).slice(0,7);

/* ---------- Irish tax year presets (Revenue / Budget figures) ---------- */
const TAX_PRESETS = {
  2024:{ srcopSingle:42000, srcopMax:51000, lowRate:.20, highRate:.40,
    prsiRate1:.04, prsiRate2:.0410, prsiChangeMonth:10,
    uscExempt:13000, uscBands:[{to:12012,rate:.005},{to:25760,rate:.02},{to:70044,rate:.03},{to:1e12,rate:.08}],
    personalCredit:1875, employeeCredit:1875 },
  2025:{ srcopSingle:44000, srcopMax:53000, lowRate:.20, highRate:.40,
    prsiRate1:.0410, prsiRate2:.0420, prsiChangeMonth:10,
    uscExempt:13000, uscBands:[{to:12012,rate:.005},{to:27382,rate:.02},{to:70044,rate:.03},{to:1e12,rate:.08}],
    personalCredit:2000, employeeCredit:2000 },
  2026:{ srcopSingle:44000, srcopMax:53000, lowRate:.20, highRate:.40,
    prsiRate1:.0420, prsiRate2:.0435, prsiChangeMonth:10,
    uscExempt:13000, uscBands:[{to:12012,rate:.005},{to:28700,rate:.02},{to:70044,rate:.03},{to:1e12,rate:.08}],
    personalCredit:2000, employeeCredit:2000 }
};
const presetFor = y => JSON.parse(JSON.stringify(TAX_PRESETS[y] || TAX_PRESETS[Math.max(...Object.keys(TAX_PRESETS).map(Number))]));

/* ---------- data model ---------- */
function blankYear(year, seed){
  const p = presetFor(year);
  return {
    year: year,
    currency: '€',
    taxBands: p,
    people: seed ? seed.people : [
      {id:uid(), name:'Person 1', gross:0, pensionPct:0, avcMonthly:0, bikMonthly:0,
       srcop:p.srcopSingle, credits:[{name:'Personal Tax Credit',amount:p.personalCredit},{name:'Employee Tax Credit',amount:p.employeeCredit}],
       bonus:0}
    ],
    splitMode:'income',            // 'income' = pro-rata on net pay, 'manual'
    splitManual:{},                // personId -> share 0-1
    lodgeIncludesSavings: true,    // does "amount to lodge into the joint account" include joint savings
    bills: seed ? seed.bills : [],
    loans: seed ? seed.loans : [],
    mortgages: seed ? seed.mortgages : [],
    savings: seed ? seed.savings : {startDate: year+'-01-01', months:24, growthPct:0, accounts:[]},
    maternity: seed ? seed.maternity : blankMaternity(),
    renewals: seed ? seed.renewals : blankRenewals(),
    rules: seed ? seed.rules : [],
    accounts: seed ? seed.accounts : [],
    payees: seed ? seed.payees : [],
    energy: seed ? seed.energy : blankEnergy(),
    txns: [],
    history: seed ? seed.history : [],
    analysis: {from: year+'-01-01', to: (year+1)+'-01-01'}
  };
}

/* Standard Irish smart-tariff windows. Suppliers vary, so they are editable. */
function blankEnergy(){
  return {
    mprn: '',
    bands:{ nightStart:23, nightEnd:8, peakStart:17, peakEnd:19 },
    vat: 9,
    summary: null,
    offers: [
      {id:uid(), name:'Current plan', day:0, night:0, peak:0, standing:0, discount:0, incVat:true, current:true}
    ]

/* Maternity Benefit is taxable but exempt from PRSI and USC - Revenue collects the
   tax by reducing credits and rate band, which usually works out at the 20% rate
   while income is down. 2026 rate is 299 a week for 26 weeks, plus up to 16 unpaid. */
function blankMaternity(){
  return {
    enabled:false, personId:'', start:'',
    paidWeeks:26, unpaidWeeks:0,
    stateWeekly:299, stateWeeks:26, benefitTaxPct:20,
    employerPhases:[],
    pausePension:true, pauseSavings:false
  };
}
const EMPLOYER_MODES = {
  topup:'Full pay (tops up the benefit)',
  percent:'% of normal salary',
  flat:'Flat amount per month'
};

function isBlankYear(y){
  if(!y) return true;
  const untouchedPerson = y.people.length<=1 && (!y.people[0] || (!num(y.people[0].gross) && !num(y.people[0].bonus)));
  return y.bills.length===0 && y.loans.length===0 && (y.mortgages||[]).length===0 && y.txns.length===0 &&
    y.accounts.length===0 && y.payees.length===0 && y.savings.accounts.length===0 &&
    y.history.length===0 && untouchedPerson;
}

/* Contract renewals. Nothing runs in the background - the app is only ever a page in
   a browser - so renewals surface on the dashboard whenever it is open, and that is
   deliberately all they do. */
function blankRenewals(){
  return { items:[] };
}
const daysUntil = d => {
  const t = parseDate(d); if(!t) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  t.setHours(0,0,0,0);
  return Math.round((t - today)/86400000);
};
/* Everything renewing within the window, soonest first - used by the dashboard. */
function upcomingRenewals(withinDays){
  const w = withinDays===undefined ? 60 : withinDays;
  return (Y.renewals && Y.renewals.items || [])
    .map(c => ({...c, days: daysUntil(c.end)}))
    .filter(c => c.days !== null && c.days <= w)
    .sort((a,b)=> a.days - b.days);
}

const KEY = 'ledger.v1';
let DB = null, Y = null;

function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB = null; }
  if(!DB || !DB.years || !Object.keys(DB.years).length){
    const y = new Date().getFullYear();
    DB = {version:1, active:String(y), theme:'dark', years:{}};
    DB.years[String(y)] = blankYear(y);
  }
  if(!DB.years[DB.active]) DB.active = Object.keys(DB.years).sort()[0];
  Object.values(DB.years).forEach(migrate);
  Y = DB.years[DB.active];
  CUR = safeCur(Y.currency);
}
/* ---------- optional server sync ----------
   Self-hosting this (see homelab/) serves the page from a small server that also keeps
   the ledger as JSON, so the same data follows you between machines instead of living
   in one browser. That server marks its endpoint with an X-Ledger-Sync header, and
   nothing here turns on without it: opened from GitHub Pages, any other static host, or
   straight off disk, the probe below finds nothing, sync stays off, no status text
   appears and the page behaves exactly as it always has on localStorage alone.

   In that case the probe is also the only request the page ever makes - a GET to its own
   origin carrying no data - and no further ones follow. */
const SYNC_URL = 'data/finance-ledger-current.json';   // relative, so it holds up under a subpath
let syncOn = false, syncPushTimer = null, syncFailed = false;

async function initSync(){
  let res;
  try{ res = await fetch(SYNC_URL, {cache:'no-store'}); }
  catch(e){ return; }                                      // offline, file://, nothing listening
  if(res.headers.get('X-Ledger-Sync') !== '1') return;     // not a ledger server: say nothing, change nothing
  syncOn = true;
  if(res.status === 404){ setStatus('Sync on - nothing stored on the server yet'); return; }
  if(!res.ok){ setStatus('Sync on - server error, using the copy in this browser'); return; }
  let j;
  try{ j = await res.json(); }
  catch(e){ setStatus('Sync on - server copy would not parse, using this browser’s'); return; }
  if(!j || !j.years || typeof j.years!=='object' || !Object.keys(j.years).length){
    setStatus('Sync on - server copy was empty, using this browser’s'); return;
  }
  /* The server is the source of truth on load - last write wins, nothing is merged - so
     do not leave this open and editing on two machines at once. */
  DB = j;
  if(!DB.years[DB.active]) DB.active = Object.keys(DB.years).sort()[0];
  Object.values(DB.years).forEach(migrate);
  Y = DB.years[DB.active];
  CUR = safeCur(Y.currency);
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  applyTheme(); render({reset:true});
  setStatus('Loaded from the server');
}
function pushToServer(){
  if(!syncOn) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>{
    fetch(SYNC_URL, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(DB)})
      .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); syncFailed = false; })
      .catch(()=>{                                         // one warning, not one per keystroke
        if(!syncFailed) setStatus('Saved in this browser - the server did not take it');
        syncFailed = true;
      });
  }, 600);
}
/* Best effort on the way out: sendBeacon bodies are capped (~64KB) and a full ledger can
   run past that, so the debounced push above is what carries most edits. */
function flushServerPush(){
  if(!syncOn) return;
  clearTimeout(syncPushTimer);
  try{ navigator.sendBeacon && navigator.sendBeacon(SYNC_URL, new Blob([JSON.stringify(DB)],{type:'application/json'})); }
  catch(e){}
}

/* Currency reaches the DOM through fmt() in a hundred places and year through
   headings and filenames, so neither is escaped at each use - they are normalised
   here instead, on the way in. */
function safeCur(v){
  const s = String(v==null?'\u20ac':v).replace(/[<>&"'`]/g,'').trim();
  return s.slice(0,3) || '\u20ac';
}
/* Runs on every year, from every entry point: startup, a JSON restore, a new-year
   roll-forward. A restored file can be any age or come from a hand-edited or partial
   export, so every field a render pass touches is defaulted here rather than assumed
   - the alternative is a render-time crash that gets mislabelled "won't parse" further
   up the chain, when the JSON parsed fine and the problem is a missing field. */
/* DB.years is keyed by a label rather than a bare year, so the same tax year can hold
   several scenarios ("2026", "2026-2"). y.year stays numeric because the tax presets
   key off it; y.label is what gets shown and used in filenames. */
function yearLabel(y){ const t = y||Y; return String(t.label || t.year || ''); }
function yearKey(label, exclude){
  let base = String(label||'').trim().replace(/[^\w \-.]/g,'').slice(0,24) || 'year';
  let k = base, n = 2;
  while(DB.years[k] && k!==exclude) k = base+'-'+(n++);
  return k;
}
function migrate(y){
  y.currency = safeCur(y.currency);
  y.year = parseInt(y.year,10) || new Date().getFullYear();
  if(!y.label) y.label = String(y.year);
  if(!Array.isArray(y.people)) y.people = [];
  if(!Array.isArray(y.bills)) y.bills = [];
  if(!Array.isArray(y.loans)) y.loans = [];
  if(!Array.isArray(y.rules)) y.rules = [];
  if(!Array.isArray(y.txns)) y.txns = [];
  if(!Array.isArray(y.history)) y.history = [];
  if(!y.savings || typeof y.savings!=='object') y.savings = {startDate:y.year+'-01-01', months:24, growthPct:0, accounts:[]};
  if(!Array.isArray(y.savings.accounts)) y.savings.accounts = [];
  if(!y.analysis || typeof y.analysis!=='object') y.analysis = {from:y.year+'-01-01', to:(y.year+1)+'-01-01'};
  if(!y.analysis.from) y.analysis.from = y.year+'-01-01';
  if(!y.analysis.to) y.analysis.to = (y.year+1)+'-01-01';
  if(!y.taxBands || typeof y.taxBands!=='object') y.taxBands = presetFor(y.year);
  if(!Array.isArray(y.taxBands.uscBands) || !y.taxBands.uscBands.length) y.taxBands.uscBands = presetFor(y.year).uscBands;
  y.people.forEach(p=>{ if(!Array.isArray(p.credits)) p.credits = []; if(!p.id) p.id = uid(); });
  if(y.energy && y.energy.summary) y.energy.summary.intervalMins = num(y.energy.summary.intervalMins)||30;
  y.bills.forEach(b=>{ if(!b.kind) b.kind = guessKind(b.name); });
  y.loans.forEach(l=>{ delete l.ppi; });                    // PPI never worked; removed
  if(!Array.isArray(y.mortgages)) y.mortgages = [];
  y.mortgages.forEach(m=>{
    if(!m.id) m.id = uid();
    if(!Array.isArray(m.rates)) m.rates = [];
    if(!Array.isArray(m.lumps)) m.lumps = [];
    if(!Array.isArray(m.statements)) m.statements = [];
    /* a rate with no date has no effect and never shows in the table, so it just sits
       there confusing the next person to look - drop it rather than keep a ghost row */
    m.rates = m.rates.filter(r=> r && r.from);
    m.rates.forEach(r=>{ if(!r.id) r.id = uid(); if(!RATE_KINDS[r.kind]) r.kind = 'variable'; });
    m.lumps.forEach(l=>{ if(!l.id) l.id = uid(); });
    m.statements.forEach(s=>{ if(!s.id) s.id = uid(); });
    m.termMonths = clamp(Math.round(num(m.termMonths)), 0, 1200);
    if(blankish(m.allowancePct)) m.allowancePct = 10;        // most Irish lenders allow 10% a year on a fix
    // mortgage protection and home insurance were separate fields; they are one line now
    if(blankish(m.insuranceMonthly)) m.insuranceMonthly = round2(num(m.lifeMonthly) + num(m.homeMonthly));
    delete m.lifeMonthly; delete m.homeMonthly;
  });
  if(!y.accounts) y.accounts = [];
  if(!y.payees) y.payees = [];
  if(!SPLIT_MODES[y.splitMode]) y.splitMode = 'income';
  if(!y.splitManual) y.splitManual = {};
  if(typeof y.lodgeIncludesSavings !== 'boolean') y.lodgeIncludesSavings = true;
  if(!y.energy) y.energy = blankEnergy();
  if(!y.energy.bands) y.energy.bands = blankEnergy().bands;
  if(y.energy.vat === undefined) y.energy.vat = 9;
  if(!y.energy.offers) y.energy.offers = [];
  if(y.energy.mprn === undefined) y.energy.mprn = (y.energy.summary && y.energy.summary.mprn) || '';
  if(!y.renewals) y.renewals = blankRenewals();
  if(!Array.isArray(y.renewals.items)) y.renewals.items = [];
  delete y.renewals.ntfy;                                   // dropped: see blankRenewals
  y.renewals.items.forEach(c=>{ if(!c.id) c.id = uid(); delete c.sent; });
  if(!y.maternity) y.maternity = blankMaternity();
  const mm = y.maternity;
  if(!mm.employerPhases){
    // fold the old single-policy fields into the first phase
    mm.employerPhases = (mm.employerMode && mm.employerMode!=='none' && num(mm.employerWeeks)>0)
      ? [{id:uid(), weeks:num(mm.employerWeeks), mode:mm.employerMode, amount:num(mm.employerAmount)}]
      : [];
    delete mm.employerMode; delete mm.employerWeeks; delete mm.employerAmount;
  }
  mm.employerPhases.forEach(p=>{ if(!EMPLOYER_MODES[p.mode]) p.mode='topup'; if(!p.id) p.id=uid(); });
  /* Imported JSON carries rules but bare transactions, which left the dashboard with no
     actuals. Only auto-run on a year that has never been categorised - once anything is
     categorised, a blank category is treated as a deliberate choice and left alone. */
  if((y.txns||[]).length && !(y.txns||[]).some(t=>t.category)) applyRules(false, y);
}

/* ---------- IBAN ---------- */
function ibanClean(s){ return String(s||'').replace(/[\s-]/g,'').toUpperCase(); }
function ibanPretty(s){ return ibanClean(s).replace(/(.{4})/g,'$1 ').trim(); }
function ibanMask(s){
  const v = ibanClean(s);
  if(v.length < 8) return v ? '\u2022'.repeat(v.length) : '';
  return v.slice(0,4)+' '+'\u2022'.repeat(Math.max(0,v.length-8)).replace(/(.{4})/g,'$1 ').trim()+' '+v.slice(-4);
}
function ibanValid(s){
  const v = ibanClean(s);
  if(!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{6,30}$/.test(v)) return false;
  const r = v.slice(4)+v.slice(0,4);
  const digits = r.replace(/[A-Z]/g, c=> c.charCodeAt(0)-55);
  let rem = 0;
  for(let i=0;i<digits.length;i++) rem = (rem*10 + (+digits[i])) % 97;
  return rem === 1;
}

/* ---------- electricity: HDF parsing, banding, tariff costing ---------- */
function bandFor(date, b){
  const h = date.getHours() + date.getMinutes()/60;
  const ns = num(b.nightStart), ne = num(b.nightEnd);
  const inNight = ns > ne ? (h >= ns || h < ne) : (h >= ns && h < ne);
  if(inNight) return 'night';
  const ps = num(b.peakStart), pe = num(b.peakEnd);
  const inPeak = ps > pe ? (h >= ps || h < pe) : (h >= ps && h < pe);
  return inPeak ? 'peak' : 'day';
}
function parseHDFDate(s){
  const m = String(s||'').trim().match(/^(\d{2})-(\d{2})-(\d{4})[ T](\d{2}):(\d{2})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
/* Reads are the END of each interval and the value is average kW over it, so the
   interval that ends at 08:00 is 07:30-08:00 and belongs to the night band. */
function summariseUsage(text, bands){
  const lines = String(text).split(/\r?\n/);
  const head = (lines[0]||'').split(',').map(h=>h.trim().toLowerCase());
  const iVal = head.findIndex(h=>h.includes('read value'));
  const iType = head.findIndex(h=>h.includes('read type'));
  const iDate = head.findIndex(h=>h.includes('read date'));
  const iMprn = head.findIndex(h=>h.includes('mprn'));
  if(iVal<0 || iDate<0) return {error:'Need "Read Value" and "Read Date and End Time" columns - this should be the HDF file from ESB Networks.'};

  const pts = [];
  let mprn = '', skipped = 0;
  for(let i=1;i<lines.length;i++){
    const ln = lines[i]; if(!ln) continue;
    const c = ln.split(',');
    const type = iType>=0 ? (c[iType]||'') : 'kW';
    if(!/import/i.test(type) && iType>=0){ skipped++; continue; }
    const d = parseHDFDate(c[iDate]);
    const v = parseFloat(c[iVal]);
    if(!d || !isFinite(v)){ skipped++; continue; }
    if(!mprn && iMprn>=0) mprn = (c[iMprn]||'').trim();
    pts.push([d.getTime(), v, /kwh/i.test(type)]);
  }
  if(pts.length < 48) return {error:'Only '+pts.length+' readings found - that is not enough to summarise.'};
  pts.sort((a,b)=>a[0]-b[0]);

  // interval length from the most common gap between consecutive reads
  const gaps = {};
  for(let i=1;i<Math.min(pts.length,600);i++){
    const g = (pts[i][0]-pts[i-1][0])/60000;
    if(g>0 && g<=120) gaps[g] = (gaps[g]||0)+1;
  }
  const mins = +Object.keys(gaps).sort((a,b)=>gaps[b]-gaps[a])[0] || 30;
  const hours = mins/60;

  // window: the last 12 complete calendar months
  const last = new Date(pts[pts.length-1][0]);
  const endEx = new Date(last.getFullYear(), last.getMonth(), 1);      // start of the incomplete month
  const start = new Date(endEx.getFullYear(), endEx.getMonth()-12, 1);
  const first = new Date(pts[0][0]);
  const from = start < first ? new Date(first.getFullYear(), first.getMonth()+ (first.getDate()>1?1:0), 1) : start;

  const months = {};
  const slotN = Math.max(1, Math.round(1440/mins));
  const slotSum = new Array(slotN).fill(0), slotCnt = new Array(slotN).fill(0);
  let day=0, night=0, peak=0, used=0;
  for(const [t,v,isKwh] of pts){
    const end = new Date(t);
    const st = new Date(t - mins*60000);
    if(st < from || st >= endEx) continue;
    const kwh = isKwh ? v : v*hours;
    const b = bandFor(st, bands);
    const k = monthKey(st);
    const m = months[k] || (months[k] = {month:k, day:0, night:0, peak:0, total:0});
    m[b] += kwh; m.total += kwh;
    if(b==='day') day+=kwh; else if(b==='night') night+=kwh; else peak+=kwh;
    const si = Math.floor((st.getHours()*60 + st.getMinutes())/mins) % slotN;
    slotSum[si] += kwh; slotCnt[si]++;
    used++;
  }
  if(!used) return {error:'No readings fell inside the last complete year.'};
  const keys = Object.keys(months).sort();
  const r2 = n => Math.round(n*100)/100;
  return {
    mprn, from: iso(from), to: iso(new Date(endEx-86400000)),
    months: keys.length,
    intervals: used, intervalMins: mins,
    day: r2(day), night: r2(night), peak: r2(peak), total: r2(day+night+peak),
    byMonth: keys.map(k=>({month:k, day:r2(months[k].day), night:r2(months[k].night),
                            peak:r2(months[k].peak), total:r2(months[k].total)})),
    profile: slotSum.map((v,i)=> slotCnt[i] ? Math.round(v/slotCnt[i]*1000)/1000 : 0),
    importedAt: iso(new Date())
  };
}
/* Cost a tariff against the summarised year. Rates are cent per kWh. */
function offerCost(o, sum, vatPct){
  if(!sum) return null;
  const c = v => num(v)/100;
  const units = sum.day*c(o.day) + sum.night*c(o.night) + sum.peak*c(o.peak);
  const disc = units * (num(o.discount)/100);
  const standing = num(o.standing);
  let total = units - disc + standing;
  const vat = o.incVat ? 0 : total*(num(vatPct)/100);
  total += vat;
  const scale = sum.months ? 12/sum.months : 1;     // normalise a short window to a year
  return {
    units: units-disc, standing, vat, discount:disc,
    annual: total*scale, monthly: total*scale/12,
    dayCost: sum.day*c(o.day), nightCost: sum.night*c(o.night), peakCost: sum.peak*c(o.peak),
    effective: sum.total ? (total/sum.total)*100 : 0
  };
}

/* ---------- tax engine ---------- */
function uscFor(income, bands, exempt){
  if(income <= exempt) return 0;
  let prev=0, total=0;
  for(const b of bands){
    if(income > prev){ total += (Math.min(income,b.to)-prev)*b.rate; prev=b.to; }
  }
  return total;
}
function calcTax(person, bands){
  const p = person, b = bands;
  const gross = num(p.gross);
  const bik = num(p.bikMonthly)*12;
  const pension = gross*(num(p.pensionPct)/100);
  const avc = num(p.avcMonthly)*12;
  const grossPay = gross + bik;                       // incl. notional pay
  const taxable = grossPay - pension - avc;
  const srcop = num(p.srcop)||b.srcopSingle;
  const tax20 = Math.min(taxable, srcop) * b.lowRate;
  const tax40 = Math.max(taxable - srcop, 0) * b.highRate;
  const liability = Math.max(tax20,0) + tax40;
  const credits = (p.credits||[]).reduce((s,c)=>s+num(c.amount),0);
  const paye = Math.max(liability - credits, 0);
  const m1 = clamp(num(b.prsiChangeMonth)-1, 0, 12), m2 = 12-m1;
  const prsi = (grossPay*b.prsiRate1/12)*m1 + (grossPay*b.prsiRate2/12)*m2;
  const usc = uscFor(grossPay, b.uscBands, b.uscExempt);
  const deductions = paye + prsi + usc + pension + avc;
  const net = gross - deductions;
  // bonus taxed at the margin
  const bonus = num(p.bonus);
  const bTax = bonus * (taxable>=srcop ? b.highRate : b.lowRate);
  const bPrsi = bonus * b.prsiRate2;
  const bUsc = uscFor(grossPay+bonus, b.uscBands, b.uscExempt) - usc;
  const bonusNet = bonus - bTax - bPrsi - bUsc;
  return {gross, bik, pension, avc, grossPay, taxable, tax20, tax40, liability, credits, paye,
          prsi, usc, deductions, net, netMonthly:net/12,
          bonus, bTax, bPrsi, bUsc, bonusNet,
          effective: grossPay? (paye+prsi+usc)/grossPay*100 : 0};
}

/* ---------- bills / budget ---------- */
const annualOf = b => num(b.amount) * (FREQ[b.freq]||12);
const kindOf = b => (b.kind==='savings' ? 'savings' : 'bill');
const billsOfKind = k => Y.bills.filter(b=> !k || kindOf(b)===k);

/* Anything that looks like money put aside rather than money spent. Only ever
   applied once, to rows saved before the bill/savings split existed. */
function guessKind(name){
  const n = String(name||'');
  if(/\b(loan|insurance|mortgage|rent|repayment)\b/i.test(n)) return 'bill';
  if(/\b(saving|savings|invest|investment|investments|pension|avc|deposit|fund|isa|etf|shares?|equities|brokerage|nest ?egg)\b/i.test(n)) return 'savings';
  return 'bill';
}
function billTotals(kind){
  const t = {annual:0, monthly:0, weekly:0, byHolder:{}, joint:0};
  for(const b of billsOfKind(kind)){
    const a = annualOf(b);
    t.annual += a;
    const h = b.holder||'Joint';
    t.byHolder[h] = (t.byHolder[h]||0) + a;
    if(h==='Joint') t.joint += a;
  }
  t.monthly = t.annual/12; t.weekly = t.annual/52;
  return t;
}
const SPLIT_MODES = {
  income:'Share of net income',
  manual:'Manual percentages',
  disposable:'Even weekly disposable income'
};
/* Work out each person's share of the joint bills.
   - income:     pro-rata on net pay
   - manual:     whatever was typed, kept raw and only normalised for the maths
   - disposable: solve so everyone is left with the same amount per week
   Returns raw entered values (for the inputs) and normalised shares (for the money). */
function jointShares(){
  const people = Y.people, n = people.length;
  const even = n ? 1/n : 1;
  if(!n) return {shares:[], raw:[], rawSum:0, capped:false};

  const bands = Y.taxBands;
  const nets = people.map(p=> calcTax(p,bands).netMonthly);
  const bt = billTotals('bill');
  const joint = bt.joint/12;
  const sp = savingsSplit();

  if(Y.splitMode==='manual'){
    const raw = people.map(p=> Y.splitManual[p.id]!==undefined ? num(Y.splitManual[p.id]) : even);
    const rawSum = raw.reduce((a,b)=>a+b,0);
    return {raw, rawSum, shares: rawSum>0 ? raw.map(v=>v/rawSum) : raw.map(()=>even), capped:false};
  }

  if(Y.splitMode==='disposable'){
    // spare_i = net_i - own bills_i - savings_i ; leftover_i = spare_i - joint*s_i
    const spare = people.map((p,i)=> nets[i] - (bt.byHolder[p.name]||0)/12 - (sp.rows[i]?sp.rows[i].total:0));
    if(joint<=0) return {shares:people.map(()=>even), raw:people.map(()=>even), rawSum:1, capped:false};
    const target = (spare.reduce((a,b)=>a+b,0) - joint) / n;   // the equal leftover
    let sh = spare.map(v => (v - target)/joint);
    // nobody pays a negative share or more than the whole pot
    const capped = sh.some(v=> v<0 || v>1);
    sh = sh.map(v=> clamp(v,0,1));
    const sum = sh.reduce((a,b)=>a+b,0);
    sh = sum>0 ? sh.map(v=>v/sum) : people.map(()=>even);
    return {shares:sh, raw:sh, rawSum:1, capped};
  }

  const totalNet = nets.reduce((a,b)=>a+b,0);
  const sh = nets.map(v=> totalNet ? v/totalNet : even);
  return {shares:sh, raw:sh, rawSum:1, capped:false};
}

/* Savings per person: their own commitments plus an even share of the joint pot. */
function savingsSplit(){
  const st = billTotals('savings');
  const heads = Y.people.length || 1;
  const jointEach = (st.joint/12)/heads;
  const rows = Y.people.map(p=>{
    const own = (st.byHolder[p.name]||0)/12;
    return {id:p.id, name:p.name, own, joint:jointEach, total:own+jointEach};
  });
  const unassigned = Object.entries(st.byHolder)
    .filter(([h])=> h!=='Joint' && !Y.people.some(p=>p.name===h))
    .reduce((s,[,a])=>s+a/12, 0);
  return {rows, jointMonthly:st.joint/12, jointEach, totalMonthly:st.monthly, unassigned, heads};
}
/* Roll a due date forward to the next occurrence on or after today. Worked out
   directly rather than stepped one period at a time - a weekly bill dated years back
   used to take hundreds of iterations and needed a loop guard to stay safe. */
function nextDueFrom(b){
  if(!b.nextDue) return null;
  const d = parseDate(b.nextDue); if(!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  if(d >= today) return d;
  const step = b.freq;
  if(step==='Weekly' || step==='Fortnightly'){
    const days = step==='Weekly' ? 7 : 14;
    const periods = Math.ceil(daysBetween(d, today)/days);
    return addDays(d, periods*days);
  }
  const months = step==='Monthly' ? 1 : step==='Quarterly' ? 3 : 12;
  const gap = (today.getFullYear()-d.getFullYear())*12 + (today.getMonth()-d.getMonth());
  let periods = Math.floor(gap/months);
  let x = addMonths(d, periods*months);
  while(x < today) x = addMonths(d, (++periods)*months);   // at most one or two passes
  return x;
}

/* ---------- bank analysis ---------- */
function analysisRange(){
  const from = parseDate(Y.analysis.from)||new Date(Y.year,0,1);
  const to = parseDate(Y.analysis.to)||new Date(Y.year+1,0,1);
  const months = Math.max((to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth()), 1);
  const weeks = Math.max(daysBetween(from,to)/7, 1);
  return {from, to, months, weeks};
}
function txnsInRange(){
  const {from,to} = analysisRange();
  return Y.txns.filter(t=>{ const d=parseDate(t.date); return d && d>=from && d<to; });
}
function categorise(desc, rules){
  const d = (desc||'').trim().toLowerCase();
  if(!d) return '';
  let bestLen = 0, bestCat = '';
  for(const r of (rules || Y.rules)){
    const m = (r.match||'').trim().toLowerCase();
    if(!m || !r.category) continue;
    if(d === m) return r.category;
    if(d.includes(m) && m.length > bestLen){ bestLen = m.length; bestCat = r.category; }
  }
  return bestCat;
}
function applyRules(force, year){
  const y = year || Y;
  let n=0;
  for(const t of (y.txns||[])){
    if(t.category && !force) continue;
    const c = categorise(t.desc, y.rules||[]);
    if(c && c!==t.category){ t.category=c; n++; }
  }
  return n;
}
function budgetVsActual(){
  const {months,weeks} = analysisRange();
  const rows = {};
  for(const b of Y.bills){
    const k = b.name;
    if(!rows[k]) rows[k] = {category:k, spend:0, budgetAnnual:0, count:0, tracked:true};
    rows[k].budgetAnnual += annualOf(b);
  }
  for(const t of txnsInRange()){
    const k = t.category || 'Uncategorised';
    if(!rows[k]) rows[k] = {category:k, spend:0, budgetAnnual:0, count:0, tracked:false};
    rows[k].spend += num(t.debit);
    rows[k].count++;
  }
  const out = Object.values(rows).map(r=>{
    r.monthlyActual = r.spend/months;
    r.weeklyActual = r.spend/weeks;
    r.monthlyBudget = r.budgetAnnual/12;
    r.varMonthly = r.monthlyActual - r.monthlyBudget;
    r.budgetPeriod = r.monthlyBudget*months;
    r.varPeriod = r.spend - r.budgetPeriod;
    r.usePct = r.budgetPeriod>0 ? r.spend/r.budgetPeriod*100 : (r.spend>0?999:0);
    return r;
  });
  out.sort((a,b)=> b.spend-a.spend);
  return out;
}

/* ---------- loan amortisation (daily interest, matches the workbook) ---------- */
function amortise(loan, useProposed){
  const rate = num(loan.rate)/100;
  const daily = rate/365.25;
  const rpy = FREQ[loan.freq]||12;
  const step = loan.freq;
  const start = parseDate(loan.startDate) || new Date();
  const normal = num(loan.repayment);
  const boosted = num(loan.proposedRepayment)||normal;
  /* Overpayments usually start partway through a loan, so the schedule pays the
     normal amount up to that date and the higher one from then on. No date means
     the higher amount applies from the start, which is how it behaved before. */
  const boostFrom = useProposed ? parseDate(loan.proposedStart) : null;
  const payAt = d => useProposed && (!boostFrom || d >= boostFrom) ? boosted : normal;
  const extras = loan.extras||{};
  let bal = num(loan.opening), date = new Date(start.getTime());
  const rows=[]; let interest=0, paid=0, n=0;
  while(bal > 0.005 && n < 1200){
    n++;
    const prev = new Date(date.getTime());
    if(step==='Weekly') date = addDays(date,7);
    else if(step==='Fortnightly') date = addDays(date,14);
    else if(step==='Quarterly') date = addMonths(date,3);
    else if(step==='Annual') date = addMonths(date,12);
    else date = addMonths(date,1);
    const int = round2(daily*bal*daysBetween(prev,date));
    const pay = payAt(date);
    const extra = useProposed ? num(extras[n]) : 0;
    let principal = Math.min(bal, Math.max(pay - int, 0) + extra);
    if(pay - int <= 0){ rows.push({n, date:iso(date), opening:bal, interest:int, principal:0, payment:int, balance:bal, stalled:true}); break; }
    const payment = principal + int;
    const closing = round2(bal - principal);
    rows.push({n, date:iso(date), opening:round2(bal), interest:int, principal:round2(principal), payment:round2(payment), balance:closing, extra});
    interest += int; paid += payment; bal = closing;
  }
  return {rows, interest:round2(interest), paid:round2(paid), payments:rows.length,
          end: rows.length? rows[rows.length-1].date : '', repayment:payAt(new Date()), cleared: bal<=0.005};
}

/* Where a loan actually stands today: what is still owed, and what interest is yet
   to be charged between now and the final payment. Everything before today has
   already happened, so it is excluded. */
function loanPosition(loan, precomputed){
  const sch = precomputed || amortise(loan, true);
  const today = new Date(); today.setHours(0,0,0,0);
  const future = sch.rows.filter(r => parseDate(r.date) >= today);
  const balance = future.length ? future[0].opening : 0;      // owed before the next payment lands
  const remainingInterest = round2(future.reduce((s,r)=> s + r.interest, 0));
  const paidInterest = round2(sch.interest - remainingInterest);
  return {
    balance: round2(balance), remainingInterest, paidInterest,
    toPay: round2(balance + remainingInterest),
    payments: future.length, next: future.length ? future[0].date : '',
    end: sch.end, cleared: !future.length, schedule: sch
  };
}
function monthsBetween(a,b){   // DATEDIF "m" semantics: whole months only
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m--;
  return m;
}
function calcRepayment(loan){
  // level repayment to clear by the target end date
  const rate = num(loan.rate)/100, rpy = FREQ[loan.freq]||12;
  const start = parseDate(loan.startDate), end = parseDate(loan.endDate);
  if(!start||!end) return 0;
  const months = monthsBetween(start,end);
  const nper = rpy*(months/12);
  if(nper<=0) return 0;
  const i = Math.pow(rate/365.25+1, 365.25/rpy)-1;
  const pv = num(loan.opening);
  if(i===0) return round2(pv/nper);
  return round2(pv*i/(1-Math.pow(1+i,-nper)));
}

/* ---------- Irish mortgage engine ----------
   Two things make a mortgage behave differently from the personal loans above, and
   both of them are why this is a separate tab rather than another loan row.

   Interest accrues daily on the cleared balance - Irish lenders quote 1/365th of the
   annual rate - and is charged monthly. And the repayment is not a figure you pick:
   the lender re-solves it over whatever is left of the ORIGINAL term every time the
   rate changes, which is exactly what lands in the post when a fixed period ends.
   Overpaying does not reduce the repayment, it shortens the term, so that is what
   happens here too.

   The monthly payments are always modelled. A statement is a reading from the lender
   rather than a payment - most people get one a year, covering twelve payments, so
   treating each one as a payment would count the year twice over. What a statement is
   good for is the balance on it: that is taken as correct on its date and the drift
   the model has built up since the last one is adjusted away. Day-count and rounding
   conventions differ between lenders and none of them publish theirs, so the model
   alone drifts by a few euro a year - the adjustments are what keep it honest. */
const MORT_BASIS = 365;
const RATE_KINDS = {fixed:'Fixed', variable:'Variable', tracker:'Tracker'};

function blankMortgage(){
  const today = iso(new Date());
  return {id:uid(), name:'Home mortgage', lender:'', startDate:today,
    principal:0, termMonths:360, propertyValue:0, repayment:0,
    rates:[{id:uid(), from:today, rate:3.9, kind:'fixed'}],
    overpayMonthly:0, overpayFrom:'', allowancePct:10,
    insuranceMonthly:0, lumps:[], statements:[]};
}
/* Rate entries are effective-from dates, so there is no such thing as a gap or an
   overlap - the latest one that has started is the one in force. A hand-edited
   restore might not be in order, so sort rather than trust the array. */
function mortRates(m){
  return (m.rates||[]).filter(r=> r && r.from)
    .slice().sort((a,b)=> String(a.from) < String(b.from) ? -1 : 1);
}
function mortRateAt(m, date){
  const rs = mortRates(m);
  if(!rs.length) return {rate:0, kind:'variable', from:''};
  let cur = rs[0];
  for(const r of rs){ const d = parseDate(r.from); if(d && d<=date) cur = r; else break; }
  return cur;
}
/* Level repayment that clears `bal` over `months`, at the monthly rate implied by
   daily accrual so a schedule left alone lands on zero at the end of the term. */
function mortPayment(bal, annualPct, months){
  if(months<=0 || bal<=0.005) return 0;
  const i = Math.pow(1 + num(annualPct)/100/MORT_BASIS, MORT_BASIS/12) - 1;
  if(i<=0) return round2(bal/months);
  return round2(bal*i/(1-Math.pow(1+i,-months)));
}
/* Interest between two dates, split at any rate change in between. The balance does
   not move between payments, so summing each segment's days is exact. */
function mortInterest(m, bal, from, to){
  if(bal<=0.005 || !(to>from)) return 0;
  const rs = mortRates(m);
  let total = 0, cursor = new Date(from.getTime());
  while(cursor < to){
    let next = to;
    for(const r of rs){ const d = parseDate(r.from); if(d && d>cursor && d<next){ next = d; break; } }
    total += bal * (num(mortRateAt(m,cursor).rate)/100/MORT_BASIS) * daysBetween(cursor,next);
    cursor = next;
  }
  return round2(total);
}
/* opts.noExtra runs the same mortgage with the overpayments and lump sums taken back
   out, which is the only honest way to say what they actually saved. */
function mortgageSchedule(m, opts){
  opts = opts||{};
  const start = parseDate(m.startDate);
  const term = clamp(Math.round(num(m.termMonths)), 0, 1200);
  const principal = num(m.principal);
  const out = {rows:[], interest:0, paid:0, extra:0, insurance:0, payments:0, end:'', balance:0,
               cleared:false, anchors:0, adjusted:0, lastAnchor:'', stalled:false};
  if(!start || principal<=0.005 || !term) return out;

  const lumps = (opts.noExtra ? [] : (m.lumps||[]))
    .filter(l=> l && l.date && num(l.amount)>0)
    .map(l=>({date:parseDate(l.date), amount:num(l.amount), note:String(l.note||'')}))
    .filter(l=> l.date).sort((a,b)=> a.date-b.date);
  const stmts = (m.statements||[])
    .filter(s=> s && s.date)
    .map(s=>({date:parseDate(s.date),
              amount:   blankish(s.amount)   ? null : num(s.amount),
              interest: blankish(s.interest) ? null : num(s.interest),
              balance:  blankish(s.balance)  ? null : num(s.balance),
              note:String(s.note||'')}))
    .filter(s=> s.date).sort((a,b)=> a.date-b.date);
  const overAmt = opts.noExtra ? 0 : num(m.overpayMonthly);
  const overFrom = parseDate(m.overpayFrom);
  const insMonthly = num(m.insuranceMonthly);

  let bal = principal, cursor = new Date(start.getTime()), li = 0, si = 0, n = 0;
  let interestTotal = 0, paidTotal = 0, extraTotal = 0, insTotal = 0;
  let sinceInterest = 0, sincePaid = 0;      // running totals since the last statement
  const rows = [];

  /* A lump sum landing mid-month reduces the balance for the rest of that month, but
     the interest it saves is not charged until the monthly charge date. Walking the
     gap in segments split at each lump keeps both of those true. */
  const advance = (from, to)=>{
    let acc = 0, lump = 0; const notes = [];
    let seg = new Date(from.getTime());
    while(li < lumps.length && lumps[li].date <= to){
      const L = lumps[li];
      const at = L.date < seg ? seg : L.date;
      acc += mortInterest(m, bal, seg, at);
      bal = round2(Math.max(0, bal - L.amount));
      lump += L.amount; if(L.note) notes.push(L.note);
      seg = at; li++;
    }
    acc += mortInterest(m, bal, seg, to);
    return {interest:round2(acc), lump:round2(lump), note:notes.join('; ')};
  };

  /* Settle any statements that fall due, as readings rather than payments. The interest
     accrued since the last payment is charged here first, because a lender's statement
     balance includes it - that is what keeps the adjustment down to a correction instead
     of a whole month of interest. Then the balance on the statement is taken as correct
     and the difference is recorded, so a schedule built from once-a-year statements
     tracks the real account instead of drifting away from it. */
  const settle = (upto, inclusive)=>{
    while(si < stmts.length && rows.length<1200 &&
          (inclusive ? stmts[si].date <= upto : stmts[si].date < upto)){
      const s = stmts[si++];
      const opening = bal, from = new Date(cursor.getTime());
      const ev = advance(cursor, s.date);
      const modelled = round2(bal + ev.interest);
      const adjust = s.balance===null ? 0 : round2(s.balance - modelled);
      bal = s.balance===null ? modelled : s.balance;
      interestTotal += ev.interest; extraTotal += ev.lump; paidTotal += ev.lump;
      sinceInterest = round2(sinceInterest + ev.interest);
      rows.push({n:++n, date:iso(s.date), statement:true, rate:num(mortRateAt(m,from).rate),
        opening:round2(opening), interest:ev.interest, principal:0, payment:0, insurance:0,
        extra:ev.lump, balance:round2(bal), adjust,
        statedBalance:s.balance, statedInterest:s.interest, statedPaid:s.amount,
        periodInterest:sinceInterest, periodPaid:round2(sincePaid),
        note:[ev.note, s.note].filter(Boolean).join('; ')});
      out.anchors++; out.adjusted = round2(out.adjusted + adjust); out.lastAnchor = iso(s.date);
      cursor = s.date; sinceInterest = 0; sincePaid = 0;
    }
  };

  let k = 1, rateKey = null, repayment = 0;
  let stated = num(m.repayment) > 0;   // dropped at the first rate change
  while(bal>0.005 && rows.length<1200 && k<=term+600){
    const payDate = addMonths(start, k);
    settle(payDate, false);                 // statements dated before this payment land first
    if(bal<=0.005) break;

    const r = mortRateAt(m, payDate);
    const key = String(r.from)+'@'+num(r.rate);
    if(key !== rateKey){
      /* Coming off recorded statements, the repayment on the statement beats anything
         derived: after overpayments the lender is still collecting the contractual
         amount, not one re-solved off the lower balance. A rate change supersedes it,
         because re-solving is exactly what the lender does at that point. */
      if(rateKey !== null) stated = false;
      rateKey = key;
      repayment = stated ? num(m.repayment) : mortPayment(bal, r.rate, Math.max(1, term-k+1));
    }
    const opening = bal, from = new Date(cursor.getTime());
    const shownRate = num(mortRateAt(m, from).rate);          // the rate this row's interest was earned at
    const ev = advance(cursor, payDate);
    const over = (!overFrom || payDate >= overFrom) ? overAmt : 0;
    let pay = round2(repayment + over);
    const due = round2(bal + ev.interest);
    if(pay <= ev.interest && ev.lump<=0){
      // repayment does not even cover the interest - flag it rather than loop forever
      rows.push({n:++n, date:iso(payDate), rate:shownRate, opening:round2(opening),
        interest:ev.interest, principal:0, payment:pay, extra:0, balance:bal,
        actual:false, stalled:true});
      out.stalled = true; break;
    }
    if(pay > due) pay = due;                                  // final payment is whatever is left
    const principalPaid = round2(pay - ev.interest);
    bal = round2(bal - principalPaid);
    if(bal < 0.005) bal = 0;
    /* Insurance rides along with the direct debit but is not a mortgage payment - it
       never touches the balance, it just makes the figure leaving the account real. */
    rows.push({n:++n, date:iso(payDate), rate:shownRate, opening:round2(opening),
      interest:ev.interest, principal:principalPaid, payment:pay, insurance:insMonthly,
      extra:round2(over+ev.lump), balance:bal, note:ev.note});
    interestTotal += ev.interest; paidTotal += pay + ev.lump; extraTotal += over + ev.lump;
    insTotal += insMonthly;
    sinceInterest = round2(sinceInterest + ev.interest);
    sincePaid = round2(sincePaid + pay + ev.lump);
    cursor = payDate; k++;
    settle(payDate, true);                  // a statement dated on a payment day reads after it
  }
  out.rows = rows;
  out.interest = round2(interestTotal);
  out.paid = round2(paidTotal);
  out.extra = round2(extraTotal);
  out.insurance = round2(insTotal);
  out.payments = rows.filter(r=> !r.statement).length;
  out.end = (()=>{ const p = rows.filter(r=> !r.statement); return p.length ? p[p.length-1].date : ''; })();
  out.balance = bal;
  out.cleared = bal<=0.005;
  return out;
}
/* Where the mortgage stands today: everything dated before today has happened. */
function mortgagePosition(m, precomputed){
  const s = precomputed || mortgageSchedule(m);
  const today = new Date(); today.setHours(0,0,0,0);
  const future = s.rows.filter(r=> parseDate(r.date) >= today);
  const past = s.rows.filter(r=> parseDate(r.date) < today);
  const balance = future.length ? future[0].opening
                : past.length ? past[past.length-1].balance : num(m.principal);
  const start = parseDate(m.startDate);
  const term = clamp(Math.round(num(m.termMonths)), 0, 1200);
  const originalEnd = (start && term) ? iso(addMonths(start, term)) : '';
  const cur = mortRateAt(m, today);
  const value = num(m.propertyValue);
  /* statement rows carry no payment, so the next one due is the next real payment */
  const futurePays = future.filter(r=> !r.statement);
  const lastAnchor = past.filter(r=> r.statement).pop();
  const ins = num(m.insuranceMonthly);
  const nextPayment = futurePays.length ? futurePays[0].payment : 0;
  return {
    balance: round2(balance),
    remainingInterest: round2(future.reduce((t,r)=> t+r.interest, 0)),
    paidInterest: round2(past.reduce((t,r)=> t+r.interest, 0)),
    toPay: round2(balance + future.reduce((t,r)=> t+r.interest, 0)),
    payments: futurePays.length, next: futurePays.length ? futurePays[0].date : '',
    nextPayment, insurance: ins, outlay: round2(nextPayment + ins),
    rate: num(cur.rate), kind: cur.kind || 'variable',
    ltv: value>0 ? balance/value*100 : 0,
    end: s.end, originalEnd,
    lastAnchor: lastAnchor ? lastAnchor.date : '',
    lastAnchorBalance: lastAnchor ? lastAnchor.balance : null,
    monthsSooner: (s.end && originalEnd) ? monthsBetween(parseDate(s.end), parseDate(originalEnd)) : 0,
    cleared: !futurePays.length && s.cleared, schedule: s
  };
}
/* Irish lenders cap what you can overpay while on a fixed rate before a break fee
   applies - commonly 10% a year, but it varies by lender and sits in your loan offer,
   so the allowance is editable and this only ever warns. The fee itself depends on
   funding rates on the day, which nobody publishes, so it is deliberately not guessed. */
function fixedOverpayWarnings(m, sch){
  const allow = num(m.allowancePct);
  if(allow<=0) return [];
  const byYear = {};
  for(const r of sch.rows){
    if(num(r.extra)<=0) continue;
    const d = parseDate(r.date); if(!d) continue;
    if((mortRateAt(m,d).kind||'variable') !== 'fixed') continue;
    const y = d.getFullYear();
    if(!byYear[y]) byYear[y] = {year:y, extra:0, opening:num(r.opening)};
    byYear[y].extra += num(r.extra);
  }
  return Object.values(byYear)
    .map(v=> ({year:v.year, extra:round2(v.extra), allowed:round2(v.opening*allow/100)}))
    .filter(v=> v.extra > v.allowed + 0.005)
    .sort((a,b)=> a.year-b.year);
}

/* ---------- savings projection ---------- */
function projectSavings(){
  const s = Y.savings;
  const start = parseDate(s.startDate) || new Date(Y.year,0,1);
  const months = clamp(num(s.months)||24, 1, 600);
  const g = num(s.growthPct)/100/12;
  const rows=[];
  let bal = s.accounts.map(a=>num(a.opening));
  for(let m=0;m<=months;m++){
    const date = addMonths(start,m);
    if(m>0){
      bal = bal.map((v,i)=>{
        const a = s.accounts[i];
        const adj = (a.adjust&&a.adjust[monthKey(date)])?num(a.adjust[monthKey(date)]):0;
        return round2(v*(1+g) + num(a.monthly) - adj);
      });
    }
    rows.push({date:iso(date), values:bal.slice(), total:round2(bal.reduce((x,y)=>x+y,0))});
  }
  return rows;
}

/* ---------------- maternity leave ----------------
   Walks the leave day by day so employer phases, the benefit window and part
   months all land correctly, then reports what each person is left with a week.
---------------------------------------------------*/
function phaseWeekly(ph, grossWeekly, stateWeekly, stateActive){
  if(!ph) return 0;
  if(ph.mode==='topup')   return Math.max(0, grossWeekly - (stateActive ? stateWeekly : 0));
  if(ph.mode==='percent') return grossWeekly * num(ph.amount)/100;
  if(ph.mode==='flat')    return num(ph.amount)*12/52;
  return 0;
}
function maternityPlan(){
  const M = Y.maternity;
  if(!M || !M.start || !Y.people.length) return null;
  const person = Y.people.find(p=>p.id===M.personId) || Y.people[0];
  const bands = Y.taxBands;
  const normal = calcTax(person, bands);
  const start = parseDate(M.start);
  if(!start) return null;

  const totalWeeks = Math.max(0, num(M.paidWeeks)) + Math.max(0, num(M.unpaidWeeks));
  const totalDays = Math.max(1, Math.round(totalWeeks*7));
  const end = addDays(start, totalDays);
  const stateDays = Math.max(0, Math.round(num(M.stateWeeks)*7));

  const grossWeekly = num(person.gross)/52;
  const stateWeekly = num(M.stateWeekly);
  const phases = (M.employerPhases||[]).filter(p=>p && num(p.weeks)>0);
  const phaseEndDay = [];
  let acc = 0;
  phases.forEach(p=>{ acc += Math.round(num(p.weeks)*7); phaseEndDay.push(acc); });
  const phaseAt = d => { for(let i=0;i<phases.length;i++) if(d < phaseEndDay[i]) return phases[i]; return null; };

  const prsiRate = num(bands.prsiRate2);
  const pensionPct = M.pausePension ? 0 : num(person.pensionPct)/100;
  const srcop = num(person.srcop);

  /* Income falls during leave, so the rate that bites is the leave YEAR's, not a normal
     year's - taxing a top-up at 40% when the year lands under the band overstates the
     gap badly. Done per calendar year, since leave usually straddles two. */
  const yrGross = {}, yrBenefit = {};
  for(let d=0; d<totalDays; d++){
    const yr = addDays(start,d).getFullYear(), stateActive = d < stateDays;
    yrGross[yr] = (yrGross[yr]||0) + phaseWeekly(phaseAt(d), grossWeekly, stateWeekly, stateActive)/7;
    yrBenefit[yr] = (yrBenefit[yr]||0) + (stateActive ? stateWeekly/7 : 0);
  }
  const yearRates = {};
  const ratesFor = yr => {
    if(yearRates[yr]) return yearRates[yr];
    const yStart = new Date(yr,0,1), yEnd = new Date(yr+1,0,1);
    const daysInYear = Math.round((yEnd-yStart)/86400000);
    const s = Math.max(yStart.getTime(), start.getTime()), e = Math.min(yEnd.getTime(), end.getTime());
    const leaveDays = e>s ? Math.round((e-s)/86400000) : 0;
    const workGross = num(person.gross)*(daysInYear-leaveDays)/daysInYear + (yrGross[yr]||0);
    const taxable = workGross + (yrBenefit[yr]||0) - workGross*(num(person.pensionPct)/100);
    const uscBand = bands.uscBands.find(b=> workGross <= num(b.to)) || bands.uscBands[bands.uscBands.length-1];
    return (yearRates[yr] = { marginal: taxable > srcop ? bands.highRate : bands.lowRate, usc: num(uscBand.rate) });
  };
  const employerNetOf = (g, yr) => {
    const r = ratesFor(yr), pension = g*pensionPct;
    return g - pension - (g-pension)*r.marginal - g*prsiRate - g*r.usc;
  };
  const benefitNetOf = b => b * (1 - num(M.benefitTaxPct)/100);

  const bucket = {};
  for(let d=0; d<totalDays; d++){
    const date = addDays(start,d), k = monthKey(date), stateActive = d < stateDays;
    const m = bucket[k] || (bucket[k] = {key:k, year:date.getFullYear(), leaveDays:0, empGross:0, stateGross:0,
      daysInMonth: new Date(date.getFullYear(), date.getMonth()+1, 0).getDate()});
    m.leaveDays++;
    m.empGross += phaseWeekly(phaseAt(d), grossWeekly, stateWeekly, stateActive)/7;
    m.stateGross += stateActive ? stateWeekly/7 : 0;
  }

  const js = jointShares();
  const sp = savingsSplit();
  const bt = billTotals('bill');
  const joint = bt.joint/12;
  const savingsAll = billTotals('savings').monthly;
  const theirSavings = (sp.rows.find(r=>r.id===person.id)||{total:0}).total;
  const savingsDuring = M.pauseSavings ? Math.max(0, savingsAll - theirSavings) : savingsAll;
  const otherNet = Y.people.filter(p=>p!==person).reduce((s,p)=> s + calcTax(p,bands).netMonthly, 0);

  const months = Object.keys(bucket).sort().map(k=>{
    const m = bucket[k];
    const empNet = employerNetOf(m.empGross, m.year);
    const stateNet = benefitNetOf(m.stateGross);
    const workedNet = normal.netMonthly * (m.daysInMonth - m.leaveDays)/m.daysInMonth;
    const actual = workedNet + empNet + stateNet;
    return {...m, empNet, stateNet, workedNet, actual, normalNet:normal.netMonthly,
      shortfall: normal.netMonthly - actual,
      householdIn: otherNet + actual, outflow: bt.monthly + savingsDuring,
      surplus: otherNet + actual - bt.monthly - savingsDuring};
  });
  if(!months.length) return null;

  const sum = k => months.reduce((s,m)=>s+m[k],0);
  const avgLeaveNet = sum('actual')/months.length;

  /* Weekly disposable per person: the Budget tab's own arithmetic, run twice - on
     normal pay, and on what they actually receive during the leave. */
  const perPerson = Y.people.map((p,i)=>{
    const onLeave = p===person;
    const net = calcTax(p,bands).netMonthly;
    const leaveNet = onLeave ? avgLeaveNet : net;
    const ownBills = (bt.byHolder[p.name]||0)/12;
    const jointBills = joint * (js.shares[i]||0);
    const sav = sp.rows[i] ? sp.rows[i].total : 0;
    const savLeave = (onLeave && M.pauseSavings) ? 0 : sav;
    const normalLeft = net - jointBills - ownBills - sav;
    const leaveLeft = leaveNet - jointBills - ownBills - savLeave;
    return {id:p.id, name:p.name, onLeave, net, leaveNet, ownBills, jointBills,
      savings:sav, savingsLeave:savLeave, normalLeft, leaveLeft,
      normalWeekly: normalLeft*12/52, leaveWeekly: leaveLeft*12/52,
      deltaWeekly: (leaveLeft-normalLeft)*12/52};
  });

  const gap = months.reduce((s,m)=> s + Math.min(0,m.surplus), 0);
  const worst = months.reduce((w,m)=> m.surplus < w.surplus ? m : w, months[0]);
  const rates = ratesFor(start.getFullYear());

  return {
    person, normal, months, start, end, totalWeeks, employerWeeks: acc/7,
    stateWeekly, grossWeekly, phases,
    marginal:rates.marginal, uscMarginal:rates.usc, prsiRate,
    normalMarginal: normal.taxable > srcop ? bands.highRate : bands.lowRate,
    otherNet, bills:bt.monthly, savingsAll, savingsDuring, theirSavings,
    normalSurplus: otherNet + normal.netMonthly - bt.monthly - savingsAll,
    perPerson, avgLeaveNet,
    totalShortfall: sum('shortfall'), totalState: sum('stateGross'), totalEmployer: sum('empGross'),
    totalSurplus: sum('surplus'), cashGap: -gap, worst,
    savingsOpening: (Y.savings.accounts||[]).reduce((s,a)=>s+num(a.opening),0)
  };
}

/* ---------------- charts (canvas, no libraries) ----------------
   Sizing rule: the .chartbox owns the dimensions. We set the canvas
   CSS size in px and the backing store to css * dpr, so the element
   can never feed its own attribute height back into layout.
-----------------------------------------------------------------*/
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function prep(cv, height){
  const box = cv.parentNode;
  const w = Math.max(Math.floor(box.clientWidth) || 0, 260);
  const h = Math.max(Math.floor(height || box.clientHeight) || 0, 150);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = w+'px';
  cv.style.height = h+'px';
  cv.width = Math.round(w*dpr);
  cv.height = Math.round(h*dpr);
  const c = cv.getContext('2d');
  if(!c) return null;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  c.font = '11px ui-monospace,Menlo,Consolas,monospace';
  c.textBaseline = 'middle';
  return {c,w,h};
}

function shortNum(v){
  const a = Math.abs(v);
  const s = a>=1e6 ? (a/1e6).toFixed(a>=1e7?0:1)+'m'
          : a>=1e4 ? Math.round(a/1e3)+'k'
          : a>=1e3 ? (a/1e3).toFixed(1)+'k'
          : Math.round(a).toString();
  return (v<0?'-':'')+CUR+s;
}
function ticks(min,max,n){
  const out=[]; for(let i=0;i<=n;i++) out.push(min+(max-min)*i/n); return out;
}
/* nice round upper bound so gridlines land on sane numbers */
function niceBounds(min,max){
  if(max===min){ max = min+1; }
  const span = max-min;
  const step = Math.pow(10, Math.floor(Math.log10(span/4)));
  const mult = [1,2,2.5,5,10].find(m=> span/4 <= step*m) || 10;
  const s = step*mult;
  return {lo: Math.floor(min/s)*s, hi: Math.ceil(max/s)*s, step:s};
}
function gridY(c,w,h,pad,lo,hi,n,fmtV){
  fmtV = fmtV || shortNum;
  c.save();
  c.strokeStyle = css('--line'); c.fillStyle = css('--muted'); c.lineWidth = 1;
  c.textAlign='right';
  ticks(lo,hi,n).forEach(v=>{
    const y = Math.round(h-pad.b-(v-lo)/(hi-lo||1)*(h-pad.t-pad.b))+.5;
    c.beginPath(); c.moveTo(pad.l,y); c.lineTo(w-pad.r,y); c.stroke();
    c.fillText(fmtV(v), pad.l-8, y);
  });
  c.restore();
}
function axisWidth(c,lo,hi,n,fmtV){
  fmtV = fmtV || shortNum;
  let m=0; ticks(lo,hi,n).forEach(v=> m=Math.max(m, c.measureText(fmtV(v)).width));
  return Math.ceil(m)+14;
}
function roundRect(c,x,y,w,h,r){
  r = Math.min(r, h/2, w/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath(); c.fill();
}
function ellipsis(c,s,maxw){
  s = String(s);
  if(c.measureText(s).width <= maxw) return s;
  while(s.length>1 && c.measureText(s+'\u2026').width > maxw) s = s.slice(0,-1);
  return s+'\u2026';
}

/* ---- horizontal grouped bars: category labels read straight across,
        so nothing rotates and nothing collides ---- */
function hBars(cv, labels, series){
  const rowH = series.length>1 ? 15 : 20;
  const gap = 16;
  const height = labels.length ? labels.length*(series.length*rowH+gap) + 34 : 150;
  const p = prep(cv, height); if(!p) return;
  const {c,w,h} = p;

  let max=0, min=0;
  series.forEach(s=>s.values.forEach(v=>{ if(isFinite(v)){ max=Math.max(max,v); min=Math.min(min,v);} }));
  const nb = niceBounds(Math.min(min,0), max||1);
  let labelW = 0;
  labels.forEach(l=> labelW = Math.max(labelW, c.measureText(l).width));
  labelW = Math.min(Math.ceil(labelW)+12, Math.max(90, w*0.32));
  const pad = {l:labelW, r:56, t:6, b:24};
  const plotW = w-pad.l-pad.r;
  const X = v => pad.l + (v-nb.lo)/(nb.hi-nb.lo||1)*plotW;

  // vertical gridlines + value scale along the bottom
  c.save();
  c.strokeStyle=css('--line'); c.fillStyle=css('--muted'); c.textAlign='center'; c.lineWidth=1;
  ticks(nb.lo,nb.hi,4).forEach(v=>{
    const x = Math.round(X(v))+.5;
    c.beginPath(); c.moveTo(x,pad.t); c.lineTo(x,h-pad.b); c.stroke();
    c.fillText(shortNum(v), x, h-pad.b+11);
  });
  c.restore();

  const band = series.length*rowH+gap;
  labels.forEach((lb,i)=>{
    const top = pad.t + i*band + gap/2;
    c.fillStyle = css('--text'); c.textAlign='right';
    c.fillText(ellipsis(c,lb,pad.l-12), pad.l-10, top + series.length*rowH/2);
    series.forEach((s,k)=>{
      const v = s.values[i]||0;
      const y = top + k*rowH;
      const x0 = X(Math.min(0,v)), x1 = X(Math.max(0,v));
      c.fillStyle = s.color;
      roundRect(c, x0, y+1, Math.max(2,x1-x0), rowH-3, 2);
      c.fillStyle = css('--muted'); c.textAlign='left';
      c.fillText(shortNum(v), x1+6, y+rowH/2);
    });
  });
}

/* ---- line / area ---- */
function lineChart(cv, labels, series, opts){
  opts = opts||{};
  const p = prep(cv, opts.height); if(!p) return;
  const {c,w,h} = p;
  const n = labels.length;
  if(!n){ c.fillStyle=css('--muted'); c.textAlign='center'; c.fillText('No data yet', w/2, h/2); return; }

  let max=-Infinity, min=Infinity;
  series.forEach(s=>s.values.forEach(v=>{ if(isFinite(v)){ max=Math.max(max,v); min=Math.min(min,v);} }));
  if(!isFinite(max)){ max=1; min=0; }
  const nb = niceBounds(min>0?0:min, max);
  const axisFmt = opts.axisFormat || shortNum;
  const pad = {l:axisWidth(c,nb.lo,nb.hi,4,axisFmt), r:14, t:10, b:26};
  gridY(c,w,h,pad,nb.lo,nb.hi,4,axisFmt);

  const X = i => pad.l + (n<2 ? (w-pad.l-pad.r)/2 : i*(w-pad.l-pad.r)/(n-1));
  const Yv = v => h-pad.b-(v-nb.lo)/(nb.hi-nb.lo||1)*(h-pad.t-pad.b);

  series.forEach(s=>{
    const pts = s.values.map((v,i)=>[X(i), Yv(isFinite(v)?v:nb.lo)]);
    if(s.fill && pts.length>1){
      c.beginPath(); pts.forEach((q,i)=> i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));
      c.lineTo(pts[pts.length-1][0], Yv(nb.lo)); c.lineTo(pts[0][0], Yv(nb.lo)); c.closePath();
      c.globalAlpha=.12; c.fillStyle=s.color; c.fill(); c.globalAlpha=1;
    }
    c.strokeStyle=s.color; c.lineWidth=2; c.lineJoin='round'; c.lineCap='round';
    c.beginPath(); pts.forEach((q,i)=> i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));
    if(s.dash) c.setLineDash([5,4]);
    c.stroke(); c.setLineDash([]);
    if(pts.length===1){ c.fillStyle=s.color; c.beginPath(); c.arc(pts[0][0],pts[0][1],3,0,7); c.fill(); }
  });

  // x labels: only as many as actually fit
  c.fillStyle=css('--muted');
  const lw = Math.max(...labels.map(l=>c.measureText(l).width)) + 16;
  const every = Math.max(1, Math.ceil(n/Math.max(1,Math.floor((w-pad.l-pad.r)/lw))));
  labels.forEach((lb,i)=>{
    if(i % every) return;
    const x = X(i);
    if(x > w-pad.r-lw/2 && i!==n-1) return;
    c.textAlign = i===0 ? 'left' : 'center';
    c.fillText(lb, i===0? pad.l : x, h-pad.b+12);
  });
  attachTip(cv, {labels, series, X, Yv, pad, w, h, tipFormat: opts.tipFormat || fmt});
}

/* ---- donut ---- */
function donut(cv, items, opts){
  opts = opts||{};
  const p = prep(cv, opts.height); if(!p) return;
  const {c,w,h} = p;
  const total = items.reduce((s,i)=>s+Math.max(0,i.value),0);
  const cx=w/2, cy=h/2, r=Math.max(20, Math.min(w,h)/2-10), ir=r*0.62;
  if(total<=0){
    c.strokeStyle=css('--line'); c.lineWidth=r-ir;
    c.beginPath(); c.arc(cx,cy,(r+ir)/2,0,Math.PI*2); c.stroke();
    c.fillStyle=css('--muted'); c.textAlign='center'; c.fillText('No data', cx, cy);
    return;
  }
  let a=-Math.PI/2;
  items.forEach(it=>{
    const sweep = Math.max(0,it.value)/total*Math.PI*2;
    if(sweep<=0) return;
    c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,r,a,a+sweep); c.closePath();
    c.fillStyle = it.color; c.fill();
    // hairline separator so adjacent slices stay distinct
    c.strokeStyle = css('--surface'); c.lineWidth=1.5;
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); c.stroke();
    a += sweep;
  });
  c.globalCompositeOperation='destination-out';
  c.beginPath(); c.arc(cx,cy,ir,0,Math.PI*2); c.fill();
  c.globalCompositeOperation='source-over';
  c.fillStyle=css('--text'); c.textAlign='center';
  c.font='600 15px ui-monospace,Menlo,Consolas,monospace';
  c.fillText(shortNum(total), cx, cy-6);
  c.font='10px ui-monospace,Menlo,Consolas,monospace'; c.fillStyle=css('--muted');
  c.fillText(opts.caption||'total', cx, cy+10);
}

/* ---- average day: one bar per interval, coloured by the rate band it falls in ---- */
function profileChart(cv, profile, bands, mins, colors){
  const p = prep(cv, 260); if(!p) return;
  const {c,w,h} = p;
  const n = profile.length;
  if(!n){ c.fillStyle=css('--muted'); c.textAlign='center'; c.fillText('No profile saved', w/2, h/2); return; }

  const max = Math.max(...profile, 0.001);
  const nb = niceBounds(0, max);
  const fmtY = v => v.toFixed(2);
  const pad = {l:axisWidth(c,nb.lo,nb.hi,4,fmtY), r:12, t:10, b:26};
  const plotW = w-pad.l-pad.r, plotH = h-pad.t-pad.b;

  // band backgrounds first, so the bars read against their window
  let runStart = 0;
  const bandAt = i => bandFor(new Date(2026,0,1, Math.floor(i*mins/60), (i*mins)%60), bands);
  for(let i=0;i<=n;i++){
    if(i===n || bandAt(i)!==bandAt(runStart)){
      const x0 = pad.l + runStart/n*plotW, x1 = pad.l + i/n*plotW;
      const b = bandAt(runStart);
      if(b!=='day'){
        c.globalAlpha = .07; c.fillStyle = colors[b];
        c.fillRect(x0, pad.t, x1-x0, plotH); c.globalAlpha = 1;
      }
      runStart = i;
    }
  }
  gridY(c,w,h,pad,nb.lo,nb.hi,4,fmtY);

  const bw = plotW/n;
  profile.forEach((v,i)=>{
    const bh = Math.max(1, (v-nb.lo)/(nb.hi-nb.lo||1)*plotH);
    c.fillStyle = colors[bandAt(i)];
    roundRect(c, pad.l+i*bw+0.5, h-pad.b-bh, Math.max(1,bw-1), bh, 1.5);
  });

  // x labels: two-digit hour only, every 3h when there is no room for more
  c.fillStyle = css('--muted'); c.textBaseline='middle';
  const perHour = 60/mins;
  const labelW = c.measureText('00').width + 10;
  const step = (24/2+1)*labelW <= plotW ? 2 : 3;   // every 2h when there is room, 3h on a phone
  for(let hr=0; hr<=24; hr+=step){
    const x = pad.l + (hr*perHour)/n*plotW;
    c.textAlign = hr===0?'left':(hr===24?'right':'center');
    c.fillText(String(hr).padStart(2,'0'), clamp(x,pad.l,w-pad.r), h-pad.b+12);
  }
}

/* ---- shared hover tooltip for line charts ---- */
function attachTip(cv, ctx){
  const box = cv.parentNode;
  let tip = box.querySelector('.tip');
  if(!tip){ tip = document.createElement('div'); tip.className='tip'; box.appendChild(tip); }
  cv._tip = ctx;
  if(cv._tipBound) return;
  cv._tipBound = true;
  const move = e=>{
    const d = cv._tip; if(!d) return;
    const rect = cv.getBoundingClientRect();
    const x = e.clientX-rect.left, y = e.clientY-rect.top;
    if(x < d.pad.l-8 || x > d.w-d.pad.r+8){ tip.classList.remove('on'); return; }
    const n = d.labels.length;
    const step = n<2 ? 1 : (d.w-d.pad.l-d.pad.r)/(n-1);
    const i = clamp(Math.round((x-d.pad.l)/step), 0, n-1);
    const tf = d.tipFormat || fmt;
    tip.innerHTML = '<b>'+esc(d.labels[i])+'</b>'+ d.series.map(s=>
      `<span><i style="background:${s.color}"></i>${esc(s.name||'')} ${tf(s.values[i]||0)}</span>`).join('<br>');
    tip.classList.add('on');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(d.X(i)-tw/2, 2, Math.max(2,d.w-tw-2))+'px';
    tip.style.top  = clamp(y-th-12, 2, Math.max(2,d.h-th-2))+'px';
  };
  cv.addEventListener('mousemove', move);
  cv.addEventListener('mouseleave', ()=> tip.classList.remove('on'));
}

/* Every edit rebuilds the tab's innerHTML, which throws away where you were:
   the page scroll, the scroll inside any tall table, and which <details> were open.
   Deleting five rules in a row meant scrolling back down five times, so the view
   state is captured before the rebuild and put back after. */
function viewState(el){
  if(!el) return null;
  return {
    y: window.scrollY || window.pageYOffset || 0,
    boxes: $$('.tw', el).map(b=>[b.scrollTop, b.scrollLeft]),
    open: $$('details', el).map(d=>d.open)
  };
}
function restoreView(el, v){
  if(!el || !v) return;
  const details = $$('details', el);
  v.open.forEach((o,i)=>{ if(details[i]) details[i].open = o; });
  const boxes = $$('.tw', el);
  v.boxes.forEach((p,i)=>{ if(boxes[i]){ boxes[i].scrollTop = p[0]; boxes[i].scrollLeft = p[1]; } });
  window.scrollTo(0, v.y);
}
function render(opts){
  if(!tabEnabled(active)) active = 'dashboard';   // tab switched off while sitting on it
  const el = $('#tab-'+active);
  const keep = (opts && opts.reset) ? null : viewState(el);
  charts.length = 0;
  CUR = safeCur(Y.currency);
  renderTabs(); renderYears();
  $$('section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  ({dashboard:renderDashboard, budget:renderBudget, tax:renderTax, loans:renderLoans,
    mortgage:renderMortgage,
    bank:renderBank, accounts:renderAccounts, savings:renderSavings, maternity:renderMaternity,
    energy:renderEnergy, renewals:renderRenewals, history:renderHistory, data:renderData}[active])(el);
  charts.forEach(f=>{ try{ f(); }catch(e){ console.warn(e); } });
  observeCharts();
  restoreView(el, keep);
}
function go(tab){ active=tab; render({reset:true}); window.scrollTo({top:0}); }
function chart(fn){ charts.push(fn); }

/* generic editable-table wiring: elements carry data-path="collection.index.field" */
function wireFields(root){
  $$('[data-path]', root).forEach(el=>{
    el.addEventListener('change', ()=>{
      const parts = el.dataset.path.split('.');
      let ref = Y;
      for(let i=0;i<parts.length-1;i++) ref = ref[parts[i]];
      const key = parts[parts.length-1];
      let v = el.type==='checkbox' ? el.checked : el.value;
      if(el.dataset.type==='number') v = num(v);
      if(el.dataset.type==='bool') v = !!v && v!=='false';
      ref[key] = v;
      save();
      if(el.dataset.norender===undefined) render();
    });
  });
}
