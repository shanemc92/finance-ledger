name: Publish homelab image

# Builds the self-hosted image and pushes it to ghcr.io so it can be pulled rather
# than built locally. index.html is in the path filter because it IS the app the
# image serves - the same file GitHub Pages publishes, with no homelab copy of it.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'homelab/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # the only write scope this needs
    steps:
      - uses: actions/checkout@v4

      # arm64 covers the Pi / ARM boxes a lot of homelabs run on
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=finance-ledger (homelab)
            org.opencontainers.image.description=Self-hosted finance-ledger with a JSON sync endpoint
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .                      # root: the image serves the root index.html
          file: homelab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
